<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>আয়না ঘরে হেফজখানা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDFBF7;
    --paper-card:#F4ECE1;
    --ink:#2C2218;
    --accent:#C68B38;
    --accent-deep:#8C5F22;
    --line:#E2D6C3;
  }
  body.dark{
    --paper:#12100E;
    --paper-card:#1C1814;
    --ink:#EAE2D5;
    --accent:#C68B38;
    --accent-deep:#E2B05E;
    --line:#383026;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Hind Siliguri','Noto Serif Bengali',sans-serif;
    background:var(--paper);
    color:var(--ink);
    transition: background 0.3s, color 0.3s;
  }

  /* TOP BAR */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:12px 16px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .icon-btn{
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px; border:1px solid var(--line);
    background:var(--paper-card); color:var(--ink); cursor:pointer;
    font-size:18px; font-weight:bold;
  }
  .topbar-title{
    font-family:'Noto Serif Bengali',serif; font-weight:700; font-size:17px;
    flex:1; text-align:center; color:var(--accent-deep);
  }

  /* VIEWS */
  .view{display:none; padding:20px 16px 140px 16px; max-width:680px; margin:0 auto;}
  .view.active{display:block;}

  /* COVER */
  .cover-wrap{
    min-height:80vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:20px;
  }
  .book-card{
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:24px; padding:32px 20px; width:100%; max-width:340px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .cover-mark{
    width:64px; height:64px; border-radius:18px;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    display:flex; align-items:center; justify-content:center;
    color:#FFF; font-family:'Noto Serif Bengali',serif; font-size:30px; font-weight:700;
  }
  .cover-title{font-family:'Noto Serif Bengali',serif; font-weight:700; font-size:26px;}
  .cover-author{color:var(--accent-deep); font-size:14px; font-weight:600; background:rgba(198, 139, 56, 0.15); padding:6px 14px; border-radius:20px;}

  .cover-actions{display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px;}
  .btn-primary{
    padding:15px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    color:#FFF; font-weight:700; font-size:16px; font-family:inherit;
  }
  .btn-secondary{
    padding:13px; border-radius:14px; cursor:pointer;
    background:var(--paper-card); border:1px solid var(--line); color:var(--ink);
    font-weight:600; font-size:15px; font-family:inherit;
  }

  /* TOC */
  .toc-item{
    display:flex; align-items:center; gap:14px;
    padding:14px; margin-bottom:10px;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:16px; cursor:pointer;
  }
  .toc-num{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background:rgba(198, 139, 56, 0.2); color:var(--accent-deep);
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .toc-title{font-size:15.5px; font-weight:600; font-family:'Noto Serif Bengali',serif;}

  /* SEARCH BOX */
  .search-input{
    width:100%; padding:14px; border-radius:14px; border:1px solid var(--line);
    background:var(--paper-card); color:var(--ink); font-size:15px; margin-bottom:16px;
  }
  .result-item{padding:12px; margin-bottom:8px; background:var(--paper-card); border:1px solid var(--line); border-radius:12px; cursor:pointer;}
  .result-chap{font-size:12px; color:var(--accent-deep); font-weight:700; margin-bottom:4px;}

  /* READER */
  .chapter-label{font-size:13px; color:var(--accent-deep); font-weight:700; margin-bottom:6px;}
  .chapter-title{font-family:'Noto Serif Bengali',serif; font-weight:700; font-size:24px; margin-bottom:20px; border-bottom:2px solid var(--line); padding-bottom:12px; line-height:1.4;}
  .chapter-body p{font-family:'Noto Serif Bengali',serif; font-size:18px; line-height:2.05; margin-bottom:18px; text-align:justify;}
  
  .chapter-body p.highlight-heading {
    font-family:'Hind Siliguri',sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--accent-deep);
    background: rgba(198, 139, 56, 0.12);
    padding: 8px 14px;
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    margin-top: 24px;
    margin-bottom: 12px;
    text-align: left;
  }

  /* BOTTOM NAV */
  .reader-nav{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; gap:12px; padding:12px 16px;
    background:var(--paper); border-top:1px solid var(--line);
  }
  .nav-btn{
    flex:1; padding:12px; border-radius:12px;
    border:1px solid var(--line); background:var(--paper-card); color:var(--ink);
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .nav-btn:disabled{opacity:.4;}

  /* SETTINGS PANEL */
  .settings-panel{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper-card); padding:12px 16px; border-radius:14px;
    margin-bottom:16px; border:1px solid var(--line);
  }
  .fs-controls button{padding:6px 12px; font-weight:bold; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--paper);}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar" id="topbar" style="display:none;">
  <button class="icon-btn" id="backBtn" onclick="showView('view-home')">❮</button>
  <div class="topbar-title" id="topbarTitle">আয়না ঘরে হেফজখানা</div>
  <button class="icon-btn" id="searchTopBtn" onclick="showView('view-search')">🔍</button>
</div>

<!-- HOME VIEW -->
<div class="view active" id="view-home">
  <div class="cover-wrap">
    <div class="book-card">
      <div class="cover-mark">আ</div>
      <div class="cover-title">আয়না ঘরে হেফজখানা</div>
      <div class="cover-author">হাফেজ মুহাম্মদ আব্দুল আহাদ</div>
    </div>
    <div class="cover-actions">
      <button class="btn-primary" onclick="openChapter(0)">পড়া শুরু করুন</button>
      <button class="btn-secondary" onclick="showView('view-toc')">সূচিপত্র দেখুন</button>
      <button class="btn-secondary" onclick="showView('view-search')">বইয়ের ভেতর খুঁজুন</button>
      <button class="btn-secondary" onclick="toggleDark()">ডার্ক মোড পরিবর্তন</button>
    </div>
  </div>
</div>

<!-- TOC VIEW -->
<div class="view" id="view-toc">
  <div class="settings-panel">
    <span>ফন্ট সাইজ:</span>
    <div class="fs-controls">
      <button onclick="changeFontSize(-2)">A-</button>
      <button onclick="changeFontSize(2)">A+</button>
    </div>
  </div>
  <div id="tocList"></div>
</div>

<!-- SEARCH VIEW -->
<div class="view" id="view-search">
  <input type="text" class="search-input" id="searchInput" placeholder="কী খুঁজতে চান এখানে লিখুন..." oninput="doSearch(this.value)">
  <div id="searchResults"></div>
</div>

<!-- READER VIEW -->
<div class="view" id="view-reader">
  <div class="settings-panel">
    <span>ফন্ট ও মোড:</span>
    <div class="fs-controls">
      <button onclick="changeFontSize(-2)">A-</button>
      <button onclick="changeFontSize(2)">A+</button>
      <button onclick="toggleDark()" style="margin-left:8px;">🌙 মোড</button>
    </div>
  </div>
  <div class="chapter-label" id="chapterLabel"></div>
  <div class="chapter-title" id="chapterTitle"></div>
  <div class="chapter-body" id="chapterBody"></div>
</div>

<!-- BOTTOM NAV -->
<div class="reader-nav" id="readerNav" style="display:none;">
  <button class="nav-btn" id="prevBtn" onclick="prevChapter()">আগের অধ্যায়</button>
  <button class="nav-btn" id="nextBtn" onclick="nextChapter()">পরের অধ্যায়</button>
</div>

<script>
const BOOK = {
  title: "আয়না ঘরে হেফজখানা",
  author: "হাফেজ মুহাম্মদ আব্দুল আহাদ",
  chapters: [
    {
      title: "শুরুর কথা",
      paragraphs: [
        "বিসমিল্লাহির রহমানির রহিম।",
        "সকল প্রশংসা মহান আল্লাহ তাআলার, যিনি মানবজাতির হিদায়াতের জন্য সর্বশ্রেষ্ঠ নিয়ামত পরম পবিত্র আল-কোরআন নাজিল করেছেন। আর অসংখ্য দরুদ ও সালাম আমাদের প্রিয় নবী রাসূলুল্লাহ (সা.)-এর প্রতি, যিনি আমাদের পরম ভালোবাসায় এই আসমানি আলো পৌঁছে দিয়েছেন।",
        "‘হাফেজে কোরআন’ — এই দুটি শব্দ কেবল একটি জাগতিক সম্মান বা সাধারণ উপাধি নয়; এটি হলো আল্লাহর কালাম বুকে ধরে রাখার এক মহাজাগতিক আমানত। যে শিশুটি তার নিষ্পাপ শৈশবে খেলার মাঠ আর মা-বাবার কোলের মায়া ছেড়ে কোরআন সিনায় ধারণ করার কঠিন যুদ্ধে নেমে পড়ে, তার প্রতিটা ফোঁটা চোখের পানি আর ক্লান্তি স্বয়ং রাব্বুল আলামিন পরম ভালোবাসায় হিসাব করে রাখেন।",
        "এই বইটি কেবল কিছু তথ্যের সমাহার বা পাণ্ডিত্য জাহিরের মাধ্যম নয়; এটি হৃদয় থেকে লেখা কিছু আবেগ ও ভালোবাসার আকুলতা। মাদ্রাসার বারান্দায় বসে যখন কোনো মাসুম ছোট শিশুকে পড়া না পারার কষ্টে নীরবে কাঁদতে দেখি, বাচ্চার খালি বিছানার দিকে তাকিয়ে কোনো মায়ের বুক যখন হু-হু করে ওঠে, কিংবা অল্প বেতনে নিজের সংসার ভুলে নিঃস্বার্থভাবে শিশুদের আলোর পথ দেখানো উস্তাদদের মেহনত দেখি, অথবা এই নূরানি সফরটা শেষ হওয়ার আগেই যখন দেখি অন্ধকারে লুকিয়ে থাকা কিছু ছায়াময় কারণে নিষ্পাপ শিশুগুলো ঝরে পড়ছে — তখন মনের ভেতর থেকে এই কথাগুলো জেগে ওঠে।",
        "সেই মেহনত, কান্না আর ভালোবাসাকে এক সুতোয় গাঁথতেই এই বইটির জন্ম। বইটিতে হাফেজে কোরআনের মহান ফযিলতের পাশাপাশি — সন্তানকে কীভাবে মানসিকভাবে সাহস দিতে হয়, পড়া মনে রাখার বাস্তবসম্মত উপায় কী, উস্তাদ ও মুহতামিম সাহেবের সুসম্পর্ক কেমন হওয়া উচিত এবং পুরো জীবন কীভাবে কোরআনের আমানত রক্ষা করতে হয় — তা খুব সহজ ও দরদি ভাষায় ফুটিয়ে তোলার চেষ্টা করা হয়েছে।",
        "যদি এই বইয়ের একটি বাক্যও কোনো ছাত্রের মনের ভয় দূর করে, কোনো মা-বাবাকে সান্ত্বনা দেয়, কিংবা কোনো উস্তাদের মেহনতকে সহজ করে — তবেই আমার সকল চেষ্টা সার্থক হবে।",
        "হে আল্লাহ! আমার এই ক্ষুদ্র মেহনতটুকু কবুল করে নাও। আমাদের সকল ভুলত্রুটি ক্ষমা করে এই বইটিকে হেদায়েত ও অনুপ্রেরণার মাধ্যম বানিয়ে দাও। আমিন।"
      ]
    },
    {
      title: "কোরআন সংকলনের সংক্ষিপ্ত ইতিহাস: আসমানি আমানতের অমর সফর",
      paragraphs: [
        "কোরআন কোনো সাধারণ কিতাব নয়; এটি নিখিল বিশ্বের রাজাধিরাজ মহান আল্লাহ তাআলার চিরন্তন আসমানি বাণী। মহাগ্রন্থ কোরআন সংরক্ষিত ছিল লাওহে মাহফুজে। সেখান থেকে সুদীর্ঘ তেইশ বছরের এক নূরানি সফরে, প্রয়োজনীয় প্রেক্ষাপট অনুযায়ী, হযরত জিবরাইল (আ.)-এর মাধ্যমে বিশ্বনবী রাসূলুল্লাহ (সা.)-এর পবিত্র হৃদয়ে অবতীর্ণ হয় এই কালাম। প্রদীপ থেকে যেমন প্রদীপ জ্বলে, ঠিক তেমনিভাবে নবীজির রুহানি স্পর্শে তা সাহাবিদের অন্তরে ছড়িয়ে পড়েছিল। তাই এই মহাগ্রন্থের প্রতিটি বর্ণ ও শব্দে সন্দেহের বিন্দুমাত্র অবকাশ নেই।",
        "ইতিহাসের পাতায় কোরআন সংরক্ষণ:",
        "ওহী নাজিল হওয়ার সাথে সাথেই রাসূলুল্লাহ (সা.) নিজে তা মুখস্থ করে নিতেন এবং সাহাবিদেরও মুখস্থ করাতেন। একই সাথে হযরত জায়েদ বিন সাবিত (রা.)-এর মতো নির্ভরযোগ্য ওহী-লেখকদের দিয়ে তা তাৎক্ষণিকভাবে লিপিবদ্ধ করিয়ে রাখতেন।",
        "রাসূলুল্লাহ (সা.)-এর ওফাতের পর হযরত আবু বকর (রা.)-এর খিলাফতকালে ইয়ামামার রক্তক্ষয়ী যুদ্ধে বহু সংখ্যক হাফেজে কোরআন সাহাবি শাহাদাত বরণ করেন। চোখের সামনে হাফেজদের বিদায় দেখে বিশ্বস্ত সাহাবিদের অন্তরে কোরআন বিলুপ্তির শঙ্কা দেখা দেয়। এই প্রেক্ষাপটে কোরআনকে এক মলাটে সংকলন করার ঐতিহাসিক সিদ্ধান্ত গ্রহণ করা হয়।",

      paragraphs: [
        "হাফেজে কোরআন সম্পর্কে তো জানা হলো। একজন হাফেজের কত দাম, কত মর্যাদা, কত ফজিলত, কত সম্মান তাইনা! তাহলে এত মর্যাদা এত সম্মান থাকা সত্ত্বেও আমরা কেন পড়তে চাই না, মাদ্রাসায় যেতে চাই না, এত ফজিলত থাকা সত্ত্বেও কেন তলবে এলেমগুলো দ্বীনের রাস্তা থেকে ঝরে যাচ্ছে। চলো তাহলে সেই কারণগুলোই খুঁজে বের করার চেষ্টা করা যাক।",
        "প্রথমত শয়তান তো মানুষের প্রকাশ্য দুশমন, সে তো আল্লাহ তায়ালার কাছে চ্যালেঞ্জ করেই এসেছে যে, আমি আপনার সব বান্দাদেরকে আমার সাথে জাহান্নামে নিয়ে যাব। সে কি কখনো চাইবে যে, একজন হাফেজে কুরআন জান্নাতে যাক এবং সাথে তার আত্মীয়-স্বজনদের মধ্যে থেকে আরও দশজন জাহান্নামীর আসামিকে সুপারিশ করে জান্নাতে নিয়ে যাক? কখনোই চাইবে না। শয়তান যেকোনো মূল্যে হলেও একজন তলবে এলেমকে দ্বীনের রাস্তা থেকে সরানোর চেষ্টা করবে।",
        "তাই শয়তান মনের ভেতরে কুমন্ত্রণা দেবে যে, দেখ তোর মা-বাবা তোকে কোন জেলখানায় রেখে গেছে — যেখানে না আছে কোনো আনন্দ-উল্লাস, না আছে বন্ধু-বান্ধবের ঘোরাফেরার সঙ্গ, আর না আছে খেলাধুলা — মৌজ-মাস্তির মতো বাহিরের অন্য সব বন্ধুবান্ধবের মতো স্বাধীন একটা জীবন। শুধু পড়া আর পড়া! পড়া আর পড়া! হুজুর সারাদিন চেঁচিয়ে শুধু পড়ো পড়ো, টেবিলে হাত থাপড়ায় আর চিল্লায় — এই পড়া নিয়ে আয়রে — এই ফিরোজ — এই জুনায়েদ — এই তাফসির জলদি সবক নিয়ে আয় তাড়াতাড়ি — সাত সবক নিয়ে আয়। এক মিনিটের মধ্যে আমুখতা নিয়ে আয় — আমি উঠলাম কিন্তু! ধুর!! সারাদিন হুজুরের এই ভেগর ভেগর আর ভালো লাগে না। সারাদিনই তো পড়ি, সেই রাত তিনটায় উঠে পড়া শুরু করেছি — সারাদিনই ট্রেন চলতেছে, সেই রাত দশটায় ঘুমানোর আগ পর্যন্ত। সারাদিনই পড়ি, তাও হুজুরের মন পাই না।",
        "বাদ দেই! সারা বছর এই জেলখানায় বন্দি থাকার পরে, বছর শেষে ছুটিতে একটু বাড়িতে যাব তাও শান্তি নাই। বাড়ির লোকজন এতদিন পরে দেখে একটু বলবে যে, বাবা তোর কি খবর, শরীর ঠিক আছে তো? ঠিক মতো খাওয়া-দাওয়া, ঘুম-গোসল হয়তো? আমাদের ছাড়া তোর দিনগুলো কেমন কাটে? তা না, কোনো খোঁজখবর নেওয়ার নাম নেই! প্রথমেই আমাদের সকলের অপছন্দনীয় প্রশ্ন — তোর পড়াশোনার কি অবস্থা? মোট কয় পারা পড়লি এই বছরে? এরপরেই আমাদের সকলের দুশমন সেই বিটকেল প্রশ্নটা — পরীক্ষার ফলাফল কী? ধুর! আর কত সহ্য করব, সারা বছর তো পড়তে পড়তে শেষ, বাড়িতে এসেও শান্তি নাই! অথচ আমার গ্রামের সব ছেলে-পেলেরাই ভালো, সকালে স্কুলে যায় আবার বিকেলেই চলে আসে। মনে চাইলে স্কুলে যাচ্ছে, মনে চাইলে বাড়িতে থাকতেছে। একদম স্বাধীন, মন চাহে জিন্দেগি। যখন যা মনে চাচ্ছে তাই করতেছে — খেলাধুলা, মৌজ-মাস্তি, ঘোরাফেরা, হাসি-তামাশা, যখন যা মনে চায়। আর আমি সারা বছর জেলখানায় পচে মরতেছি!!",
        "আর একটু বয়স হয়ে গেলে তো কোনো কথাই নাই। আর কতদিন, কতদিন হেফজখানায় থাকব। বয়স তো কম হলো না, সতেরো-আঠারো হয়েই যাচ্ছে। হুজুররা বলে হাফেজ হওয়া মানে কেবল লেখাপড়ার শুরু। আবার মাওলানা হতে আট-দশ বছর লাগবে। শুরু করতেই যদি সতেরো-আঠারো বছর লাগে, তাহলে ওগুলো কবে শেষ করব। বাবা তো বৃদ্ধ, কয়দিন আর বুড়া মানুষের গলায় ভর দিয়ে খাব? বাবা যদি কিছুদিন পর একেবারেই চলতে না পারে, তখন তো সংসারের হাল আমাকেই ধরতে হবে। তাহলে এমনিতেই আমার পড়াশোনা কিছুদিন পর বাদ দেওয়াই লাগবে, তার থেকে বরং এখনই বাদ দেই। কাজে গেলে ততদিনে পাকা মিস্ত্রি হয়ে যাব।",
        "এরপরে আরেকটা সমস্যা হলো — এলাকার সব খালাতো ভাইয়েরা ভাবি বানিয়ে ফেলছে। আমার সময় আসবে কবে? বড়ও হয়ে যাচ্ছি! বাড়িতে বলতেও পারছি না! বাড়ি থেকে তো আমাকেই খাইতে দিতে চায় না, পরের মেয়েকে কী দেবে? তার থেকে বরং কাজ-বাজ করে নিজের পায়ে নিজে দাঁড়াই, এরপর নিজের একটা বন্দোবস্ত করি!",
        "এতক্ষণ আলোচনা করলাম শয়তানের তাবলিগি মেহনত ও নসিহতের কথা। চলো আরেকটু খোঁজাখুঁজি করা যাক, আর দেখা যাক চিপায়-চাপায় লুকিয়ে থাকা আর কয়েকটা কারণ বের করা যায় নাকি। এই ফেতনার জামানায় সবচেয়ে বুজুর্গ মানুষই হলো তলবে এলেমরা, হ্যাঁ ঠিক শুনছো, আমরাই! আমাদের জন্যই এই পৃথিবী টিকে আছে। যেদিন আল্লাহ তায়ালার নাম নেওয়ার মতো কেউ থাকবে না, সেদিন আল্লাহ তায়ালা এই পৃথিবী ধ্বংস করে দেবেন। বলতে গেলে এই ফেতনার জামানায় আল্লাহর নাম নেয়, অর্থাৎ আল্লাহ তায়ালার বিধি-বিধানগুলো ঠিকমতো মেনে চলে এমন লোক পাওয়া প্রায় দুর্লভ। কিন্তু তলবে এলেমের মাদ্রাসার রুটিনটা কোনো সাধারণ শিক্ষার রুটিন না। এটা আল্লাহর বিধান মানার জন্য অন্যতম একটা তরতিব। বাড়তি কোনো আমলের প্রয়োজন নেই — কাউকে জান্নাতে নেওয়ার জন্য একটা কওমি মাদ্রাসার নেজামই যথেষ্ট।",
        "কোনো ছাত্র যখন মাদ্রাসায় অধ্যয়নরত অবস্থায় থাকে, তার জন্য মাদ্রাসার নেজাম মানাটা অবশ্যক বটেই, বরং না মেনে চলা প্রায় অসম্ভব। বড় বড় মাদ্রাসায়, বড় বড় জামাতে অনেক ছাত্রের ভিড়ে দু-চার জনের জন্যে ওস্তাদের চোখ ফাঁকি দিয়ে একটু উল্টাপাল্টা করা যদিও সম্ভব হয়, কিন্তু আমার মনে হয় না বাংলাদেশে এমন কোনো মাদ্রাসা আছে যেখানে একটা হেফজখানার ছাত্র হেফজখানার ওস্তাদের চোখ ফাঁকি দিয়ে মাদ্রাসার কোনো নেজাম ভঙ্গ করে নিজের মনমতো চলবে, এমন কোনো সুযোগ আছে। কেননা একটা হেফজখানার ছাত্রের চব্বিশ ঘণ্টাই কাটে ওস্তাদের নেগরানির মাধ্যমে। এখন মাদ্রাসার নেজাম অনুযায়ী যদি কোনো ছাত্র পড়াশোনা করে, মাদ্রাসা যদি কামাই না দেয়, তাহলে একটা ছাত্রের হাফেজ হতে সাধারণত তিন বছর সময় লাগে, যদিও ছাত্রটা দুর্বল হয়। যদি বেশি দুর্বল হয় তাহলে দুই-চার মাস বেশি লাগতে পারে, এটা বড় কোনো ব্যাপার না। কিন্তু দেখা যায় চার-পাঁচ, এমনকি ছয় বছরও লাগে অনেক মাদ্রাসার অনেক ছাত্রের হাফেজ হতে। আমাদের মাদ্রাসায় একবার এক ছাত্র ভর্তি হয়েছিল, সে কোন মাদ্রাসায় পড়ত আল্লাহ তাআলাই ভালো জানেন! ওই বেচারা নাকি সাত বছরে বারো পারা হেফজ করেছে, তাও ইয়াদ নাই!",
        "কেন রে ভাই, যেখানে একটা দুর্বল ছাত্রেরই হেফজ সম্পূর্ণ করতে তিন থেকে সাড়ে তিন বছর লাগার কথা, সেখানে এত বছর লাগছে কেন? আমার জানামতে কোনো ছাত্রের এতটা দুর্বল হওয়ার কথা না, যে হেফজ শেষ করতে ছয়-সাত বছর সময় লাগবে, তাও আবার ইয়াদ ছাড়া! আর যদি সত্যিই এতটা দুর্বল হয়, তাহলে হেফজ পড়ার দরকার কী? কারণ হাফেজ হওয়া ফরজ না, কিন্তু হাফেজ হলে ইয়াদ রাখাটা ফরজ। এত বছর কষ্ট করে লাভ কী? বাবা-মার টাকা-পয়সা নষ্ট করে লাভ কী, যদি এমন হাফেজ হই ইয়াদই না থাকে! কারণ হাফেজ হওয়া তো ফরজ না! কিন্তু এত বছর সময় নষ্ট না করে হেফজখানার এই সময়টায় কিতাব বিভাগে ভর্তি হলে ছাত্রটার প্রায় মাওলানার কাছাকাছি পর্যন্ত পড়া হয়ে যায়।",
        "এই যে ছাত্রদের হাফেজ হতে এত সময় লাগছে, আবার ইয়াদও থাকছে না — আমার মনে হয় এগুলো ছাত্রদের দুর্বলতার দোষ না, এগুলো মাদ্রাসার নেজামের দোষ, এগুলো ওস্তাদদের নেগরানির দোষ! হয়তো মাদ্রাসার নেজাম বা তরতিবের মধ্যে কোনো সমস্যা আছে, অথবা ওস্তাদদের মধ্যে গাফেলতি আছে। হ্যাঁ, শুনতে কষ্ট হলেও এটাই বাস্তব!",
        "আর ইয়াদ না থাকার যে কষ্ট! না সামনে আগাতে মন চায়, আর না বাড়ির চাপে চুপ মেরে থাকা যায়। কারণ বছর শেষে তো ঠিকই হিসাব চাইবে — এই বছরে কয় পারা পড়লি? নাহিদ তো এই বছরে দশ পারা পড়ল, ফিরোজ তো এই বছরে পনেরো পারা পড়ল, তুই কয় পারা পড়লি? মনের মধ্যে কোনো শান্তি থাকে না। খেতে বসতে, চলতে-ফিরতে, সব সময় কেমন জানি অস্থির অস্থির লাগে। বাহির থেকে মাদ্রাসায় কোনো মেহমান আসলে বুকের ভেতর ধুকধুক শুরু হয়ে যায় — না জানি বোর্ডের কোনো হুজুর আসলো বোধহয়, যদি ইমতেহান চায়! কোনো হাফেজ সাহেবকে দেখলে তো কোনো কথাই নাই, নিজেকে আড়াল করে কোনোমতে পাশ কাটিয়ে যেতে পারলেই বাঁচি! আবার যদি কোনো প্রশ্ন করে বসে! ছবক পড়ার সময় মাথার মধ্যে ঘুরপাক খায় — ইশ! আমি সামনে তো আগাচ্ছি, পেছনের পারাগুলোর যে অবস্থা!",
        "এই টেনশনে ছবকও ভালোভাবে হয় না, ফলে সাত-ছবকও কাঁচা হয়ে যায়। আর সাত-ছবক কাঁচা মানে পারা কাঁচা। এভাবে পেছনের কাঁচা পারার সাথে সাথে নতুন পারাগুলোও কাঁচা হতে হতে যায়। একদিকে পারা বাড়ে, অপরদিকে টেনশন বাড়ে। এমতাবস্থায় শয়তানের সেই ওয়াজ-নসিহতগুলো মনের ভেতর আরো শেকড় গেড়ে বসে। একটা সময় দেখা যায় যে, ছাত্রটার পড়াশোনা শেষ!",
        "বলতে পারো, আমি এসব কথা জানলাম কেমনে? আসলে আমি কারো মুখে শোনা কথা বলছি না, আমি আমার নিজের জীবনের বাস্তব অভিজ্ঞতা থেকে বলছি। আমিও জীবনে অনেকবার অনেক ধাক্কা খেয়েছি। আর সেই ধাক্কাগুলো থেকে একটা একটা করে শিক্ষা গ্রহণ করেছি।",
        "আসলে প্রতিকূলতা মানুষকে সভ্যতা শেখায়। অন্ধকারের প্রতিকূলতা মানুষকে আলোর দিশা দিয়েছে, বন-জঙ্গলের হিংস্র প্রাণীর ভয়ের প্রতিকূলতা মানুষকে আশ্রয়স্থলের সভ্যতা শিখিয়েছে। আমরা সকলেই তো বৈদ্যুতিক বাতি ব্যবহার করি, এর আবিষ্কারের ইতিহাস কি জানো? চলো একবার ইতিহাস থেকে ঘুরে আসি।",
        "লাইট যে আবিষ্কার করেছেন — থমাস আলভা এডিসন। তিনি একটি থিওরি আবিষ্কার করলেন যে, এভাবে এভাবে করলে এই লাইটটা জ্বলবে। তিনি সেই অনুযায়ী কাজ করলেন, কিন্তু লাইটটা জ্বললো না। তিনি আবার চেষ্টা করলেন, কিন্তু তাও জ্বললো না। আবার চেষ্টা করলেন, এবারও ব্যর্থ! কিন্তু তবুও তিনি হতাশ হলেন না, তিনি তাঁর চেষ্টা চালিয়ে যেতে লাগলেন। একের পর এক চেষ্টা চালিয়ে যেতে লাগলেন — একভাবে ব্যর্থ হচ্ছেন, অন্যভাবে চেষ্টা করছেন। এভাবে চেষ্টা চালাতে চালাতে যখন তাঁর চেষ্টা করার সংখ্যা দাঁড়িয়েছে নয়শ নিরানব্বই, তখনও তিনি ব্যর্থ, এখনো সফল হতে পারেননি। তাও তিনি হাল ছাড়ার পাত্র নন! তিনি তাঁর চেষ্টা চালিয়েই যাবেন! যখন তিনি আরেকবার চেষ্টা করলেন — অর্থাৎ তাঁর চেষ্টা করার সংখ্যা এখন এক হাজার — তখন বেচারা সফল হলেন। তো সবশেষে তাঁকে যখন প্রশ্ন করা হলো, “আপনি এতবার ব্যর্থ হওয়ার পরও হতাশ হননি? পিছপা হননি? আপনি আপনার এই বৃথা চেষ্টাটা থামিয়ে দেননি?” তিনি তখন যে উত্তরটা দিয়েছিলেন, আসলেই তা শোনার মতো ছিল! তিনি তখন বললেন, “কে বলেছে আমি নয়শ নিরানব্বই বার ব্যর্থ হয়েছি? আমি তো লাইটটি না জ্বলার নয়শ নিরানব্বইটি কারণ খুঁজে বের করেছি!”",
        "আসলে তিনি ব্যর্থতার মাঝেই সফল না হওয়ার কারণগুলো চিহ্নিত করেছেন। এটাই আমাদের জীবনের জন্য একটা বড় শিক্ষা — যেকোনো প্রতিকূল অবস্থায় কীভাবে উত্তরণের উপায় খুঁজে বের করা যায়।",
        "অনুরূপভাবে, আমি আমার বাস্তব জীবন থেকে যে অভিজ্ঞতাটুকু পেয়েছি, যে প্রশ্নগুলোর সম্মুখীন হয়েছি এবং যে প্রতিকূল পরিস্থিতি আমি পার করে এসেছি, সেই কারণগুলোই চিহ্নিত করে তোমাদের সাথে শেয়ার করছি। যাতে তোমাদেরও আমার মতো প্রতিকূলতায় ভুগতে না হয় এবং পরবর্তী প্রজন্মকে যেন আবার সেই একই প্রশ্নগুলোর মুখোমুখি হতে না হয় — তার জন্যই আমার এই ছোট্ট প্রয়াস।"

    {
      title: "কেমন মাদ্রাসায় ভর্তি হওয়া উচিত",
      paragraphs: [
        "ভালো করে পড়াশোনা করার জন্য দরকার ভালো একটা পরিবেশ। একজন ছাত্রের শুধু আগ্রহ আর ভালো মেধা থাকলেই পড়াশোনা ভালো হয় না। তাই যদি হতো, তাহলে তো কোনো ছাত্র তার আগ্রহ ও মেধা খাটিয়ে মাদ্রাসায় না গিয়ে বাড়িতে বসেই হাফেজ বা মাওলানা হয়ে যেত। কিন্তু তা কোনোদিনই সম্ভব নয়। কারণ বাড়িতে তার আগ্রহ ও মেধা খাটানোর মতো পরিবেশ নেই। তাই আগ্রহ ও মেধার পাশাপাশি দরকার পড়াশোনা করার মতো ভালো একটা সুশৃঙ্খল পরিবেশ।",
        "আমাদের ওস্তাদ আল্লামা শাহ আব্দুল গফুর আল হাবিবী (দামাত বারাকাতুহু) হুজুর বলতেন, “মাদ্রাসা হলো তিনটি জিনিসের নাম। যে মাদ্রাসায় এই তিনটি জিনিস নেই, সেটি কোনো মাদ্রাসাই না।” এই তিনটি জিনিস হলো — এক, তালীম (শিক্ষা); দুই, তরবিয়াত (প্রশিক্ষণ ও শিষ্টাচার); তিন, খেদমত (সেবা)।",
        "তালীম হলো লেখাপড়া। অর্থাৎ পড়াশোনার যতগুলো দিক রয়েছে, হেফজ-নাজরা-কিতাবখানার যত পড়াশোনা রয়েছে, সকল পড়াশোনা একত্রে তালীমের ভেতর গণ্য। যেখান থেকে শিক্ষার্থী সঠিক শিক্ষা গ্রহণ করতে পারে। যে মাদ্রাসায় পড়াশোনা ভালো হয় না বা তালীমের মান ভালো না, সেটি ভালো মাদ্রাসা হতে পারে না। অর্থাৎ পড়াশোনা করার জন্য দরকার সুন্দর তালীমী নেজাম (শিক্ষাব্যবস্থা)।",
        "এরপরেই আসে তরবিয়াত। ছাত্রদের পড়াশোনা করার জন্য আখলাকি নেজাম। আমল, আখলাক ও পড়াশোনার সুশৃঙ্খল পরিবেশ — এগুলো সবই তরবিয়াতের অন্তর্ভুক্ত। যে মাদ্রাসায় ভালো পড়াশোনার পাশাপাশি ছাত্ররা আমলদার, সুন্দর চরিত্রের অধিকারী এবং সুন্নতের অনুসারী হয়, বুঝতে হবে সে মাদ্রাসার তরবিয়াত ঠিক আছে। নতুবা একটা ছাত্র হাফেজ হচ্ছে, অথচ সে তাহাজ্জুদ পড়ে না, মিসওয়াক করে না, তার কথাবার্তায় সুন্নতি আদব নেই, আর তার লেবাস ও চলাফেরা অশালীন বা ঢিলেঢালা — তাহলে তো হবে না। এজন্যই তালীমের পাশাপাশি তরবিয়াতেরও সমান প্রয়োজন।",
        "এরপরেই হলো সবচেয়ে গুরুত্বপূর্ণ বিষয়টি — খেদমত। খেদমত হলো ওস্তাদ, ছাত্র এবং মাদ্রাসা — এই তিনটির পারস্পরিক সম্পর্ক। ওস্তাদ ছাত্রকে মহব্বত ও স্নেহ করবেন, আর ছাত্র ওস্তাদকে মহব্বত ও সম্মান করবে। ওস্তাদ যা বলবেন, ছাত্র তা অক্ষরে অক্ষরে পালন করবে। ওস্তাদের কোনো প্রয়োজন হলে ছাত্র তা বুঝে নিয়ে নিজে থেকেই এগিয়ে দেবে।",
        "ওস্তাদ ও ছাত্র সকলে মিলে মাদ্রাসার দেখভাল করা, মাদ্রাসার আসবাবপত্রের হেফাজত করা, ছাত্ররা ওস্তাদদের অন্যান্য খেদমত এবং মাদ্রাসার যেকোনো কাজে উপস্থিত থাকা — এই সবগুলোই খেদমতের অন্তর্ভুক্ত। মাদ্রাসার যেকোনো দরকারে ডাক দিলে সে ডাকে সাড়া দেওয়া উচিত। তবে তাই বলে পড়াশোনা বাদ দিয়ে সারাদিন খেদমত নিয়েই পড়ে থাকা যাবে না। কোনো প্রয়োজন থাকলে এমন সময় বের করতে হবে যাতে পড়াশোনার কোনো ব্যাঘাত না ঘটে। তবে আমার জানামতে, হেফজখানায় পড়াশোনার ফাঁকে সময় বের করা প্রায় অসম্ভব। কারণ হেফজখানার চব্বিশ ঘণ্টার যে রুটিন, সেটা শিকলের আংটার মতো একটার সাথে আরেকটা যুক্ত। শিকলের প্রতিটি আংটা যেমন দরকারি, তেমনি হেফজখানার চব্বিশ ঘণ্টার প্রতিটি মুহূর্তই গুরুত্বপূর্ণ।",
        "যেহেতু চব্বিশ ঘণ্টাই ছাত্রদের পড়ার সময়, তাই এর মধ্য থেকে অবসর বের করা বলতে গেলে অসম্ভব। এরপরেও মাদ্রাসার খুব জরুরি প্রয়োজনে যদি হঠাৎ একটু সময় দেওয়া হয়, সেটা ভিন্ন কথা। কিন্তু প্রতিদিন ক্লাস বাদ দিয়ে মাদ্রাসার কাজ করা এটা একেবারেই মেনে নেওয়ার মতো নয়। অনেক মাদ্রাসায় মনে করা হয়, ছাত্ররা তো হাফেজ হয়ে যাচ্ছে বা বড় হয়ে যাচ্ছে, অথচ হেফজখানায় তো হেফজের বাইরে অন্য কিছু শেখানো হয় না। তাই হেফজের পাশাপাশি অন্য কিছুও শেখানো দরকার — যেমন রান্নাবান্না, কোনো হাতের কাজ, কিংবা মাসের মধ্যে তাবলীগে নিয়ে গিয়ে দাওয়াতি কাজ করানো।",
        "এই উদ্যোগগুলো নিঃসন্দেহে ভালো। তবে এগুলো করতে গিয়ে যদি মূল পড়াশোনার ব্যাঘাত ঘটে, তবে এই উদ্যোগ বন্ধ রাখাই আমার মনে হয় বুদ্ধিমানের কাজ। কেননা ছাত্রদের অন্যদিকে দক্ষ বানাতে গিয়ে যদি তারা তাদের আসল লক্ষ্যই ভুলে যায়, তবে তার প্রয়োজন কী? তখন সেটা হবে নিত্যদিনের মুখরঞ্জিত পানের সাথে চুন খাওয়ার মতো ব্যাপার — যা আমরা মুখের স্বাদে খাই, কিন্তু মাত্রাতিরিক্ত হলে মুখ জ্বালিয়ে দেওয়ার ক্ষমতা রাখে।",
        "অনেক সময় হেফজখানার ছাত্রদের নসিহত করতে গিয়ে উদাহরণ দেওয়া হয় — বড় বড় মাদ্রাসায় ছাত্ররা কত কাজ করে! হাটহাজারী বা মেখলের ছাত্ররা পাহাড় থেকে কাঠ কেটে নিয়ে আসে। ইতিহাস শোনানো হয় — আগের দিনের ছাত্ররা ওস্তাদদের বাড়ির গরুর জন্য ঘাস কেটে দিত, ওস্তাদদের খেত নিড়িয়ে দিত। ভালো কথা, তবে এসব খেদমত হেফজখানার ছোট ছোট ছাত্রদের ওপর চাপিয়ে দেওয়ার আগে জানতে হবে — যাদের ইতিহাস বলা হচ্ছে, তারা কোন জামাতের ছাত্র ছিল এবং কত বড় ছিল! তাঁদের দৃষ্টান্ত আদৌ হেফজখানার রুটিনের ছোট ছাত্রদের সাথে যায় কি না?",
        "বিষয়টি বুঝতে একটি গল্প বলা যাক। একটি উট পানিতে নেমে গোসল করছে, পানি তার গলা পর্যন্ত। একটি ভেড়া এসে উটকে বলল, “ভাই, আমি গোসল করব, কিন্তু সাঁতার তো জানি না। ওখানে কেমন পানি?” উট সত্যি কথাই বলল, “এখানে তো গলা পানি।” এখন ভেড়াটি যদি উটের কথা শুনে ওই পানিতে গোসল করতে নেমে পড়ে, তবে তোমরাই বলো, ভেড়াটি কি আদৌ গোসল করতে পারবে, নাকি পানিতে ডুবে মরবে? কেননা ভেড়াটিকে আগে বুঝতে হবে — যে উটের সাথে সে নিজেকে তুলনা করছে, তার সাথে নিজের শারীরিক তুলনা চলে কি না!",
        "অনুরূপভাবে, হেফজখানার ছোট ছোট ছাত্রদের বড় বড় মাদ্রাসার উঁচু জামাতের ছাত্রদের সাথে তুলনা করে সেসব কাজ এদের ওপর চাপিয়ে দেওয়া মোটেও যুক্তিযুক্ত নয়। কারণ হেফজখানা ও কিতাবখানা দুটো সম্পূর্ণ আলাদা বিভাগ। কিতাবখানায় ক্লাসের সময় নির্দিষ্ট থাকে, কিন্তু হেফজখানায় চব্বিশ ঘণ্টাই পড়ার সময়। এর মধ্য থেকে সময় বের করা প্রায় অসম্ভব। হ্যাঁ, মাদ্রাসার কোনো বিশেষ বা জরুরি প্রয়োজন থাকলে দু-একদিন ব্যতিক্রম হতে পারে। তাই বলে প্রতিদিন ক্লাস টাইমে! না ভাই, এটা কোনোভাবেই মানার মতো না।",
        "যদি ঘন ঘন কাজের জন্য ছাত্রদের ক্লাস টাইম থেকে ডেকে নেওয়া হয়, তবে ক্লাসের ও পড়াশোনার যে গুরুত্ব, তা ছাত্রদের মন থেকে হারিয়ে যায়। যে জিনিস যেখানে দুর্লভ, সেখানে তার কদর বেশি। যেমন পানি — আমাদের দেশে অঢেল আছে বলে আমরা গুরুত্ব বুঝি না। কিন্তু সৌদি আরবের মতো যেসব দেশে পানির তীব্র সংকট, সেখানে জ্বালানি তেলের চেয়েও পানের পানির দাম নাকি বেশি! তারা বোঝে পানির কত দাম, কত গুরুত্ব ও প্রয়োজনীয়তা। তাই তারা পানিকে সেভাবেই কদর করে। কিন্তু আমাদের এখানে যেকোনো কাজে ইচ্ছেমতো পানি খরচ ও অপচয় করা হচ্ছে।",
        "এখন আমাদের এখানে যদি কাউকে নসিহত করা হয় — “ভাই, পানি অনেক মূল্যবান জিনিস, পানি নষ্ট কোরো না। অজুর সময় ট্যাপ জোরে ছেড়ে দিও না, গোসলের সময় এক বালতির জায়গায় দুই বালতি পানি ব্যবহার কোরো না” — তখন লোকটি হয়তো বলবে, “ধুর! কত পানি কত জায়গায় নষ্ট হচ্ছে, আর কাজের সময় আসলেই আপনারা অপচয় রোধের স্লোগান তোলেন!”",
        "অনুরূপভাবে, ছাত্রদের ক্লাস টাইমের সময়টা যখন ঘন ঘন অন্য কাজে ব্যবহার করা হবে (যদিও তা মাদ্রাসার খাতিরেই হোক না কেন), তখন ছাত্রদের মনেও ঠিক একই প্রশ্ন ঘুরপাক খাবে — এমনিতেই তো কত সময় নষ্ট হয়! পাঁচ মিনিট দেরি করে ক্লাসে বসলে তেমন কী ক্ষতি হবে? একটু পরে এলে কী বা এসে যাবে? কিংবা একদিন অনুপস্থিত থাকলে সমস্যা কোথায়?",
        "অতঃপর ছাত্রদের সময় সম্পর্কে যতই উপদেশ দেওয়া হোক না কেন — সময়কে কাজে লাগাও, সময়ের কদর করো, সময়ের অনেক দাম — তখন কিন্তু সেসব নসিহত কোনো প্রভাবই ফেলবে না। এক কান দিয়ে ঢুকে অন্য কান দিয়ে বেরিয়ে যাবে। এজন্য মাদ্রাসার খেদমত বা অন্য যেকোনো কাজই হোক না কেন, বিশেষ করে হেফজখানার ছাত্রদের সময় যেন কোথাও অযথা নষ্ট না হয়, সেদিকে কঠোর দৃষ্টি রাখা আবশ্যক।",
        "এই গেল তালীম, তরবিয়াত ও খেদমত। এই তিনটির পাশাপাশি একজন হেফজখানার ছাত্রের জন্য আরেকটি অত্যন্ত গুরুত্বপূর্ণ বিষয় হলো — যে মাদ্রাসায় ভর্তি হবে, আগে খোঁজ নিয়ে দেখা যে সেই মাদ্রাসার মুহতামিম (পরিচালক) হাফেজ কি না। কারণ মাদ্রাসা চলে মুহতামিমের নেজাম (ব্যবস্থাপনা ও রুটিন) অনুযায়ী।",
        "মুহতামিম যদি হাফেজ না হন, তবে তিনি তাঁর মনমতো এমন এক নেজাম তৈরি করে বসবেন, যা হয়তো হেফজখানার বাস্তব চাহিদার সাথে মিলবে না। তিনি তো বুঝবেন না হেফজখানার কোন সময়ে কোন পড়া আবশ্যক এবং কোন সময়ে পড়ার গুরুত্ব কতটুকু! হয়তো তিনি মাদ্রাসার পড়াশোনার উন্নতির লক্ষ্যে বড় বড় ভালো মাদ্রাসার নেজাম অনুসরণ করবেন, কিন্তু তিনি তো বুঝবেন না যে সেই নেজামের মধ্যে কোনো ত্রুটি বা অসুবিধা আছে কি না। কারণ তিনি অন্যের মুখে শুনে হয়তো বলবেন যে এটা ভালো, কিন্তু তিনি নিজে তো এ বিষয়ে অভিজ্ঞ নন। তাই এমন কোনো মাদ্রাসায় ভর্তি হওয়ার চেষ্টা করা উচিত, যে মাদ্রাসার মুহতামিম অন্তত একজন হাফেজ।"
      ]

    {
      title: "উস্তাদদের কিছু গাফিলতি: স্বপ্নের কারিগর যখন অসাবধান",
      paragraphs: [
        "আমাদের সবার জানা একটি চিরন্তন সত্য প্রবাদ বাক্য রয়েছে — “ছাত্ররা হলো কাঁচা কাদামাটির মতো।” কাদামাটি যতক্ষণ নরম থাকে, একজন কুমার তাকে পরম মমতায় যেভাবে ইচ্ছা মোচড় দিয়ে সুন্দর পাত্র, হাঁড়ি-পাতিল কিংবা গৃহস্থালির রূপ দিতে পারেন। আমাদের এই ছোট ছোট মাসুম শিশুরা ঠিক সেই নরম কাদামাটি, আর উস্তাদ হলেন সেই রূপকার বা কুমার।",
        "উস্তাদ যদি সঠিক মেহনত আর ভালোবাসা ঢেলে দেন, তবে তিনি তাঁর ছাত্রকে জীবনের সবচেয়ে আলোকময় মানুষ হিসেবে গড়ে তুলতে পারেন। সেই পাত্রটি যেমন চিরকাল মানুষের উপকারে আসে এবং তার সমস্ত সৌন্দর্য কুমারের প্রশংসা বয়ে আনে, তেমনি একজন দরদি উস্তাদের মেহনতের ফলও দুনিয়া ও আখেরাতে উজ্জ্বল হয়ে থাকে। কিন্তু কুমার যদি সেই কাদামাটি নিয়ে কাজ না করে অলসতা ও অবহেলায় ফেলে রাখেন, তবে মাটি একসময় শুকিয়ে শক্ত ঢিলে পরিণত হয়। তখন তাকে দিয়ে আর কোনো সুন্দর রূপ দেওয়া সম্ভব হয় না; তা কেবল পথের প্রান্তে পড়ে থাকা একখণ্ড অর্থহীন পাথর হয়ে রয়।",
        "কড়া তেতো সত্য ও আসমানী আমানত। কথাগুলো হয়তো শুনতে একটু তেতো লাগছে! কিন্তু পেটের কৃমি মারতে যেমন তিতা ওষুধ ছাড়া উপায় থাকে না, তেমনি এই তেতো সত্যটাও আজ আমাদের মেনে নিতে হবে। কারণ উস্তাদদের ভেতরের কিছু গাফিলতিরূপী কৃমির পার্শ্বপ্রতিক্রিয়ায় আজ ধ্বংস হয়ে যাচ্ছে হাজার হাজার আলেমে দ্বীন বা হাফেজে কোরআন হওয়ার সম্ভাবনাময় জীবন।",
        "এখনকার সময়ে বেশিরভাগ শিশুই নিজের ইচ্ছায় মাদ্রাসায় আসে না; প্রায় নিরানব্বই শতাংশ ছাত্রই পরিবারের চাপে পড়ে মাদ্রাসায় ভর্তি হয়। আমরা ওয়াজ-নসিহতে ছাত্রদের কত সুন্দর করে বলি — “আল্লাহ তাআলা দুনিয়ার লাখ লাখ মানুষের ভিড় থেকে বাছাই করে তোমাকে তাঁর কোরআনের জন্য বেছে নিয়েছেন।” এটি যেমন সত্য, তেমনি উস্তাদদেরও বোঝা উচিত — দেশজুড়ে হাজার হাজার মাদ্রাসা ও উস্তাদ থাকা সত্ত্বেও মহান আল্লাহ ওই নির্দিষ্ট ছাত্রটিকে পড়ার জন্য আপনার কাছেই পাঠিয়েছেন! ছাত্রটি যতবার কোরআন তিলাওয়াত করবে, যত আমল করবে, তার নেকির একটি অংশ উস্তাদের আমলনামায় যুক্ত হবে। আল্লাহ উস্তাদকেও ভালোবেসে এই মহা নিয়ামত দিয়েছেন। সুতরাং প্রতিটি ছাত্র উস্তাদের কাছে এক একটি আসমানী আমানত।",
        "উস্তাদদের কিছু প্রাত্যহিক ও নীরব গাফিলতি। উস্তাদ যখন এই আমানতের কদর ভুলে যান, তখনই তৈরি হয় নানা রকম গাফিলতি।",
        "দুর্বল ছাত্রদের প্রতি বৈষম্য: যে ছাত্রটি সহজে সবক দেয়, তাকে সবাই ভালোবাসে। কিন্তু যে ছাত্রটি মেধা বা অসুস্থতার কারণে পিছিয়ে পড়ে, তার প্রয়োজন উস্তাদের একটু বাড়তি ধৈর্য, সময় ও চোখের পানির দোয়া। দুর্বলকে অবহেলা করে “তোকে দিয়ে কিছু হবে না” বলে মানসিকভাবে ভেঙে দেওয়া একজন শিক্ষকের সবচেয়ে বড় ব্যর্থতা।",
        "শাসনের নামে নিষ্ঠুরতা ও প্রহার: পড়া না পারলে রাগের মাথায় অতিরিক্ত প্রহার বা কটু কথা বলা একেবারেই অনুচিত। শাসনের উদ্দেশ্য হওয়া উচিত সংশোধন, প্রতিশোধ নয়। মারধরের ভয়ে সাময়িক পড়া আদায় হতে পারে, কিন্তু শিশুর ভেতরের পড়ার আনন্দ ও মাদ্রাসার প্রতি ভালোবাসা চিরতরে মরে যায়।",
        "ছাত্রদের মানসিক অবস্থার খবর না রাখা: ছোট শিশুরা পরিবার ছেড়ে মাদ্রাসায় থাকে। অনেক সময় শারীরিক অসুস্থতা, একাকিত্ব বা মন খারাপের কারণে তারা পড়া দিতে পারে না। তাদের সমস্যার গভীরে না গিয়ে শুধু সাজা দিলে উস্তাদের প্রতি শ্রদ্ধা হারিয়ে যায়। উস্তাদকে হতে হবে বাবার মতো স্নেহশীল।",
        "অমূল্য সময় নষ্ট ও ব্যক্তিগত কাজে ব্যবহার: ক্লাসের সময়ে উস্তাদ যদি নিজের কাজে ব্যস্ত থাকেন কিংবা ছাত্রদের দিয়ে ঘন ঘন নিজের ব্যক্তিগত কাজ করান, তবে ছাত্রের মন থেকে পড়াশোনার কদর মুছে যায়। উস্তাদ নিজেই সময়ে ক্লাসে না এলে ছাত্রকে শাসন করার নৈতিক অধিকার হারিয়ে ফেলেন; তখন ছাত্রের মনেও ফাঁকি দেওয়ার প্রবণতা জাগে।",
        "নিয়মিত সবক ও ইয়াদের হিসাব না নেওয়া: প্রতিদিনের পড়া প্রতিদিন না নেওয়া বা খেয়ালখুশি মতো ক্লাস চালানো। নিয়মিত তদারকি না থাকলে ছাত্ররা অলস হয়ে পড়ে এবং ধীরে ধীরে পেছনের পড়া দুর্বল হয়ে পুরো শিক্ষাজীবন এলোমেলো হয়ে যায়।",
        "ছাত্রদের সামনে ক্ষোভ ও হতাশা উগরে দেওয়া: অনেক সময় উস্তাদরা মাদ্রাসার পরিচালনা, মুহতামিম সাহেবের সিদ্ধান্ত, কম বেতন বা খাবারের মান নিয়ে ছাত্রদের সামনে আক্ষেপ করেন। এতে ছাত্ররা ভাবতে শুরু করে — “এত কষ্ট করে পড়াশোনা করে শেষমেশ হুজুরদের মতো এমন কষ্টই তো করতে হবে, তাহলে পড়ে লাভ কী?” শয়তান এই সুযোগে তাদের মনে কুচিন্তা ঢুকিয়ে দেয় এবং একসময় ছাত্রটি পড়ালেখাই ছেড়ে দেয়।",
        "উস্তাদদের প্রতি আকুল নিবেদন। উস্তাদদের জীবনে নানা রকম পারিবারিক বা আর্থিক সমস্যা থাকতেই পারে। মাদ্রাসার চাকরি ভালো না-ই লাগতে পারে। কিন্তু নিজের সমস্যার অসিলায় অবহেলা করে নিরীহ ছাত্রদের জীবন নষ্ট করা কোনোভাবেই মানা যায় না।",
        "আমি আপনাদের পায়ে হাত রেখে বিনয়ের সাথে আকুতি জানাই — যতদিন মন থেকে ভালো লাগবে, আল্লাহকে ভালোবেসে এই মহান দায়িত্ব পালন করুন। আর যখন ভালো লাগবে না, দয়া করে সম্মানজনকভাবে চাকরি ছেড়ে অন্য কিছু করুন; কিন্তু আল্লাহর দেওয়া এই মাসুম আমানতগুলোর ভবিষ্যৎ ধ্বংস করবেন না। উস্তাদের মুখের এক চিলতে ভালোবাসা একটি দিশেহারা শিশুকে বিশ্বজয়ী হাফেজ বানিয়ে দিতে পারে, আবার সামান্য গাফিলতি একটি সম্ভাবনাময় দীপ্ত কুঁড়িকে ফোটবার আগেই ঝরিয়ে দিতে পারে।"
      ]

    {

      paragraphs: [

        "একটি শিশুকে যদি সঠিক এবং সুনির্দিষ্ট রুটিনের ওপর রেখে পরিচালনা করা যায়, তবে পড়ার সফরটি যেমন ছাত্রের জন্য সহজ হয়, তেমনই উস্তাদের জন্যও তাকে গাইড করা সহজ হয়ে ওঠে। এতে কারও ওপর কোনো প্রকার জুলুম বা বাড়তি চাপ সৃষ্টি হয় না। মূলত পড়াশোনার নেযাম বা ব্যবস্থাপনার ঘাটতির কারণেই পড়া আটকে যাওয়া, সবক না হওয়া, ইয়াদ ভুলে যাওয়া, হাফেজ হতে অতিরিক্ত সময় লাগা এবং পারাগুলো ভুলে গিয়ে মানসিক চাপে ছাত্রদের ঝরে পড়ার মতো ঘটনা ঘটে।",
        "সঠিক নিয়মে বা নেযামে পড়ালে এই সমস্যাগুলো এড়ানো সম্ভব। আমার পছন্দের একটি আদর্শ হেফজখানার নেযাম নিচে বর্ণনা করা হলো:",
        "১. মক্তব ও নাজেরা: হেফজের মূল বীজ",
        "একজন হেফজখানার ছাত্রের সফলতার বীজ রোপণ হয় তার মক্তব ও নাজেরার পড়ার মধ্য দিয়ে। সেখান থেকে সে যদি ভালোভাবে নাজেরা পড়ে আসে, তবে তার জন্য হেফজ করা অনেক সহজ হয়ে যায়। তা না হলে হেফজখানায় এসে তাকে একই সাথে নাজেরা ঠিক করা এবং হেফজ করার দ্বৈত চাপে পড়তে হয়। তাই মক্তব থেকেই নাজেরাটা হেফজের মতো গুরুত্ব দিয়ে চালু রাখা উচিত—পার্থক্য শুধু এতটুকু যে, হাফেজ সাহেবরা না দেখে পড়েন আর নাজেরার ছাত্র দেখে পড়ে।",
        "২. বাচ্চার ভয় দূর করা ও পড়ার প্রতি আগ্রহ জাগানো:",
        "নতুন একটা ছোট বাচ্চা যখন মক্তব থেকে হেফজখানায় আসে, শুরুতে আগ্রহ থাকলেও দিন দিন পড়ার চাপ বাড়লে সে হেফজখানার প্রতি ভীতি পোষণ করতে শুরু করে। এই সময়ে উস্তাদের সর্বপ্রথম কাজ থাকে যেকোনো উপায়ে বাচ্চার পড়ার প্রতি আবার আগ্রহ পয়দা করা।",
        "সমান সময়ে আসা অন্য সাথী ভাইয়ের সাথে সুস্থ প্রতিযোগিতামূলক আবহ তৈরি করা যেতে পারে। তবে তুলনা করে অপমান বা মানসিক চাপ না দিয়ে উৎসাহ দেওয়া উচিত। যে বাচ্চা আগে পড়া শেষ করবে, তার জন্য প্রয়োজনে উস্তাদের পক্ষ থেকে ছোটখাটো একখণ্ড হাদিয়ার ব্যবস্থা করা যায়। এতে ছাত্রদের আগ্রহ আরও বেড়ে যায়।",
        "৩. মৌলিক পরিভাষার সাথে পরিচয় করানো:",
        "ছাত্রটি যেহেতু নতুন এসেছে, সে জানে না কোনটা কী এবং কখন কী করতে হয়। উস্তাদের দায়িত্ব থাকবে পরম মমতায় বুঝিয়ে দেওয়া—কোনটাকে “সবক” বলে, কোনটাকে “সাত সবক” বলে, কোনটাকে “আমুখতা” বলে এবং কোনটা কীভাবে মুখস্থ করতে হয়; কোন সময় কোনটা পড়তে হয়।",
        "দৈনন্দিন আদর্শ রুটিন ও আমল:",
        "আসরের আগে — সবক দেখে নেওয়া: আসরের ১৫–২০ মিনিট আগে থেকে নতুন সবকের পৃষ্ঠাটি ভালোভাবে দেখে নেওয়া। এমনভাবে নাজেরা পড়বে, যেন প্রায় অর্ধেক মুখস্থ হয়ে যায়। পড়া শেষে উস্তাদ বা ওই পৃষ্ঠা পড়া কোনো সাথী ভাইয়ের কাছে ধরিয়ে নেওয়া এবং লোকমা (ভুল) গেলে তখনই তা সংশোধন করে নেওয়া।",
        "মাগরিব থেকে এশা — সবক ইয়াদ করা: মাগরিবের নামাজের পর মসজিদে কোনো আমল থাকলে তা সম্পূর্ণ করে, কারও সাথে অপ্রয়োজনীয় কথা না বলে দরূদ শরীফ পড়তে পড়তে রুমে চলে আসা। এরপর কোরআন শরিফ হাতে নিয়ে “রব্বি যিদনী ইলমা” পড়তে পড়তে খোলা এবং চেষ্টা করা এক বসাতেই সবকটি ভালো করে ইয়াদ করার। এশার আগেই প্রস্তুতকৃত সবক সাথী ভাইকে শোনানো; কোনো লোকমা পড়লে তখনই তা শুধরে নেওয়া।",
        "এশার পরের আমল: এশার পর থেকে ঘুমানোর আগ পর্যন্ত সময়টা হলো সাত সবক ইয়াদ ও শোনানোর সময়। “সাত সবক” মানে শুধু ৭ পৃষ্ঠা নয়; তুমি যে পারায় পড়ছ, সেই পারায় ১৯ পৃষ্ঠা হলেও পুরোটা তোমার সাত সবক। আগামীকালের ফজরের পরের জন্য না রেখে চেষ্টা করতে হবে আজ এশার পরেই তা শুনিয়ে ফেলার। ঘুমানোর আগে সবাই নামাজে দাঁড়িয়ে হাফ পারা তিলওয়াত করবে। এরপর কেউ চাইলে অতিরিক্ত পড়তে পারে, সেটা তার ব্যক্তিগত বিষয়।",
        "শেষ রাত — সবক শোনানো: ফজরের দেড় ঘণ্টা আগে উঠে ওজু ও প্রয়োজনীয় কাজ সেরে তাহাজ্জুদে দাঁড়িয়ে যাওয়া। নামাজ-দোয়া শেষ করে ক্লাসে বসা। গতকাল মাগরিবে মুখস্থ করা সবকটি আর কয়েকবার দেখে নেওয়া এবং উস্তাদের কাছে নিয়ে যাওয়া। চেষ্টা করা একদম বিনা লোকমায় সবক শোনানো; ভুল হলে তা সংশোধন করে শেখার শৃঙ্খলা বজায় রাখা।",
        "ফজরের পর — সাত সবক: ফজরের নামাজের আমল শেষ করে মসজিদ থেকে বের হয়ে ১০ মিনিট মাঠে একটু হাঁটাচলা ও ব্যায়াম করা, যাতে শরীরে তন্দ্রা বা ক্লান্তি থাকলে তা দূর হয়। এরপর রুমে ফিরে এসে কারও এশার পর সাত সবক দেওয়া বাকি থাকলে তা শোনানো। উস্তাদ তাঁর মনমতো সাত সবকের পৃষ্ঠা প্রথম থেকে, মাঝখান থেকে বা প্রশ্ন ধরে শোনবেন। সকাল ৭টার হালকা নাস্তার বিরতির আগেই সবার সাত সবক শেষ করা।",
        "সকাল ৭:০০–৮:৩০ — আমুখতা: সাত সবক শেষ করেই আমুখতা শোনানো বা তৈরি করা। সকাল সাড়ে আটটা পর্যন্ত ক্লাস চলার পর সকালের খাবারের বিরতি।",
        "হরফের মাশক ও দুপুরের ঘুম: খাবার খেয়ে এসে ক্লাসে বসা এবং একটানা ১০টা পর্যন্ত হরফের মাশক (সঠিক উচ্চারণ অনুশীলন) করা। ১০টা থেকে ১২টা পর্যন্ত দুপুরের ঘুমের বিরতি।",
        "দুপুর ১২টা থেকে আসর — আমুখতা ও তিলওয়াত: ১২টায় উঠে ওজু-গোসল সেরে ১২:৩০-এর মধ্যে ক্লাসে বসা এবং আমুখতা করা বাকি থাকলে তা শেষ করা। যোহরের নামাজ ও তারপর কোনো আমল থাকলে তা শেষ করে দুপুরের খাবার খাওয়া। খাবার শেষে ১০ মিনিট বিশ্রাম (কায়লুলা) করা। এরপর আবার ক্লাসে বসে আসরের আগে নতুন সবকের নাজেরা দেখার আগ পর্যন্ত একটানা ৩, ৪ বা ৫ পারা (কমপক্ষে ৩ পারা) তিলওয়াত করা। মাঝখানে ছোট্ট বিরতি থাকতে পারে।",
        "সাপ্তাহিক ও মাসিক সবিনা (রিভিশন) নেযাম:",
        "বুধবারের নিয়ম: বুধবার সকালে সাত সবক শেষ করার পর এই সপ্তাহে যে কয় পারা আমুখতা শোনানো হয়েছে, সেগুলোসহ সবিনার পারাগুলো বণ্টন করে দেওয়া। বুধবারে কোনো আমুখতা থাকবে না; সারা দিন শুধু সবিনার পারাগুলো ইয়াদ করা। বুধবার আসরের আগে নতুন ছবক দেখবে, মাগরিবের পর নতুন সবক পড়া এবং বৃহস্পতিবার সকালে সবক দেওয়া।",
        "বৃহস্পতিবারের নিয়ম: বৃহস্পতিবার ফজরের পর থেকে উস্তাদ যেভাবে জোড়া বানিয়ে দেন, সেভাবে দুই সাথী মিলে সবিনা শোনানো। পড়া শেষে উস্তাদ তিলওয়াতকৃত সবিনার পারাগুলোর ওপর ইমতিহান (পরীক্ষা) নেবেন।",
        "সবিনার হিসাব ও মাসিক সবিনা: প্রতিদিন হাফ পারা আমুখতা দিলে সপ্তাহে হয় ২ পারা, আর বাইরে থেকে ১ পারা—মোট ৩ পারা করে প্রতি সপ্তাহে সবিনা হবে। চার সপ্তাহে পড়া হবে ১২ পারা। পঞ্চম সপ্তাহে একটানা এই ১২ পারা দাওর করা হবে, যাকে বলা হয় “মাসিক সবিনা”।",
        "যদি এইভাবে রুটিন ও সুন্দর আমল মেনে ছাত্রদের পরিচালিত করা যায় এবং নিয়মিত খোঁজখবর রাখা হয়, তবে কোনো ছাত্রের হাফেজ হতে বেশি সময়ও লাগবে না এবং পারা ভুলে গিয়ে মানসিকভাবে ভেঙে পড়ার আশঙ্কাও কমবে।"
      ]

    {
      title: "পড়া মনে রাখার বাস্তবসম্মত কৌশল: আসমানি কালাম অন্তরে স্থায়ী করার সহজ উপায়",
      paragraphs: [
        "আল-কোরআন কোনো সাধারণ সাহিত্য বা বই নয়; এটি রাব্বুল আলামিনের জীবন্ত আসমানি ওহী। শত শত পৃষ্ঠা আরবি হরফ কোনো মানুষের মেধার শক্তিতে হুবহু বুকে ধরে রাখা কঠিন, যদি না মহান আল্লাহ তাআলা তার জন্য সহজ করে দেন। তবে কোরআন মুখস্থ করা এবং স্মৃতিতে তাজা রাখার জন্য মেহনতের পাশাপাশি কিছু সুনির্দিষ্ট, বাস্তবসম্মত ও দ্বীনি কৌশল রয়েছে।",

let currentChapter = 0;
let currentFontSize = 18;

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  
  const isHome = (id === 'view-home');
  const isReader = (id === 'view-reader');
  
  document.getElementById('topbar').style.display = isHome ? 'none' : 'flex';
  document.getElementById('readerNav').style.display = isReader ? 'flex' : 'none';
  document.getElementById('topbarTitle').textContent = isReader ? BOOK.title : (id === 'view-search' ? 'বইয়ের ভেতর অনুসন্ধান' : 'সূচিপত্র');
  window.scrollTo(0, 0);
}

function renderTOC() {
  const list = document.getElementById('tocList');
  list.innerHTML = '';
  BOOK.chapters.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'toc-item';
    div.innerHTML = `<div class="toc-num">${i+1}</div><div class="toc-title">${ch.title}</div>`;
    div.onclick = () => openChapter(i);
    list.appendChild(div);
  });
}

function openChapter(index) {
  currentChapter = index;
  const ch = BOOK.chapters[index];
  document.getElementById('chapterLabel').textContent = `অধ্যায় ${index+1} / ${BOOK.chapters.length}`;
  document.getElementById('chapterTitle').textContent = ch.title;
  
  const body = document.getElementById('chapterBody');
  body.innerHTML = '';
  ch.paragraphs.forEach(p => {
    const el = document.createElement('p');
    if(p.endsWith(':') || p.includes('—') && p.length < 80){
      el.className = 'highlight-heading';
    }
    el.textContent = p;
    body.appendChild(el);
  });

  applyFontSize();
  document.getElementById('prevBtn').disabled = (index === 0);
  document.getElementById('nextBtn').disabled = (index === BOOK.chapters.length - 1);

  showView('view-reader');
}

function prevChapter() { if(currentChapter > 0) openChapter(currentChapter - 1); }
function nextChapter() { if(currentChapter < BOOK.chapters.length - 1) openChapter(currentChapter + 1); }

function toggleDark() {
  document.body.classList.toggle('dark');
}

function changeFontSize(val) {
  currentFontSize = Math.max(14, Math.min(26, currentFontSize + val));
  applyFontSize();
}

function applyFontSize() {
  document.querySelectorAll('.chapter-body p').forEach(p => {
    p.style.fontSize = currentFontSize + 'px';
  });
}

function doSearch(keyword) {
  const resDiv = document.getElementById('searchResults');
  resDiv.innerHTML = '';
  if(!keyword || keyword.length < 2) return;
  
  let found = 0;
  BOOK.chapters.forEach((ch, cIndex) => {
    ch.paragraphs.forEach(p => {
      if(p.toLowerCase().includes(keyword.toLowerCase())) {
        found++;
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `<div class="result-chap">${ch.title}</div><div>${p}</div>`;
        item.onclick = () => openChapter(cIndex);
        resDiv.appendChild(item);
      }
    });
  });
  if(found === 0) {
    resDiv.innerHTML = '<div style="text-align:center; color:var(--accent-deep); margin-top:20px;">কোনো ফলাফল পাওয়া যায়নি</div>';
  }
}

renderTOC();
</script>
