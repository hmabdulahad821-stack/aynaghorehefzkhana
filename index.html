<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>আয়না ঘরে হেফজখানা</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8C5F22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="আয়না ঘরে হেফজখানা">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-2:#F3EBD9;
    --ink:#2B2418;
    --ink-soft:#5C5240;
    --accent:#B8863B;
    --accent-deep:#8C5F22;
    --line:#E3D8BE;
    --dark-bg:#181511;
    --dark-surface:#221E17;
    --dark-ink:#EFE7D6;
    --dark-line:#3A3226;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Hind Siliguri','Noto Serif Bengali',sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
  }
  body.dark{background:var(--dark-bg); color:var(--dark-ink);}

  #app{position:relative; height:100vh; width:100vw; overflow:hidden;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:14px 14px calc(10px + env(safe-area-inset-top,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  body.dark .topbar{background:var(--dark-surface); border-color:var(--dark-line);}
  .icon-btn{
    width:38px; height:38px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--ink); cursor:pointer;
  }
  body.dark .icon-btn{border-color:var(--dark-line); color:var(--dark-ink);}
  .icon-btn svg{width:19px; height:19px;}
  .topbar-title{
    font-family:'Noto Serif Bengali',serif; font-weight:600; font-size:16px;
    flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--accent-deep);
  }
  body.dark .topbar-title{color:var(--accent);}

  /* ---------- SCREENS ---------- */
  .screen{
    position:absolute; inset:0;
    padding-top:64px;
    padding-top:calc(64px + env(safe-area-inset-top,0px));
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    transform:translateX(100%);
    transition:transform .28s ease;
    background:var(--paper);
  }
  body.dark .screen{background:var(--dark-bg);}
  .screen.active{transform:translateX(0);}
  #screen-home.active ~ .screen{transform:translateX(100%);}

  /* ---------- HOME / COVER ---------- */
  #screen-home{padding-top:0;}
  .cover-wrap{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:40px 28px; gap:18px;
  }
  .cover-mark{
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(160deg,var(--accent),var(--accent-deep));
    display:flex; align-items:center; justify-content:center;
    color:#FBF6EC; font-family:'Noto Serif Bengali',serif; font-size:26px; font-weight:700;
    box-shadow:0 8px 20px -6px rgba(140,95,34,.5);
  }
  .cover-title{
    font-family:'Noto Serif Bengali',serif; font-weight:700; font-size:30px; line-height:1.35;
  }
  .cover-author{color:var(--ink-soft); font-size:14px; letter-spacing:.02em;}
  body.dark .cover-author{color:#B8AC90;}
  .cover-divider{width:40px; height:2px; background:var(--accent); border-radius:2px; margin:2px 0;}
  .cover-actions{display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px; margin-top:10px;}
  .btn-primary{
    padding:14px; border-radius:12px; border:none; cursor:pointer;
    background:var(--accent-deep); color:#FBF6EC; font-weight:600; font-size:15px;
    font-family:inherit;
  }
  .btn-secondary{
    padding:13px; border-radius:12px; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--ink);
    font-weight:500; font-size:14px; font-family:inherit;
  }
  body.dark .btn-secondary{border-color:var(--dark-line); color:var(--dark-ink);}
  .cover-progress{font-size:12.5px; color:var(--ink-soft);}
  body.dark .cover-progress{color:#B8AC90;}

  /* ---------- TOC ---------- */
  .toc-list{padding:8px 14px 40px;}
  .toc-item{
    display:flex; align-items:center; gap:14px;
    padding:16px 6px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  body.dark .toc-item{border-color:var(--dark-line);}
  .toc-num{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    background:var(--paper-2); color:var(--accent-deep);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px;
  }
  body.dark .toc-num{background:var(--dark-surface); color:var(--accent);}
  .toc-item.read .toc-num{background:var(--accent-deep); color:#FBF6EC;}
  .toc-text{flex:1; min-width:0;}
  .toc-item-title{font-size:15px; font-weight:600;}
  .toc-item-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  body.dark .toc-item-sub{color:#8A7E64;}
  .toc-chevron{color:var(--ink-soft); flex-shrink:0;}

  /* ---------- SEARCH ---------- */
  .search-bar-wrap{padding:12px 14px 6px;}
  .search-input{
    width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--paper-2); color:var(--ink);
    font-size:14.5px; font-family:inherit;
  }
  body.dark .search-input{background:var(--dark-surface); border-color:var(--dark-line); color:var(--dark-ink);}
  .search-input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .search-hint{padding:14px 20px; color:var(--ink-soft); font-size:13px; text-align:center;}
  body.dark .search-hint{color:#8A7E64;}
  .search-results{padding:4px 14px 40px;}
  .result-item{
    padding:13px 8px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  body.dark .result-item{border-color:var(--dark-line);}
  .result-chap{font-size:11.5px; color:var(--accent-deep); font-weight:600; margin-bottom:4px;}
  body.dark .result-chap{color:var(--accent);}
  .result-snippet{font-size:14px; line-height:1.6;}
  mark{background:var(--accent); color:#FBF6EC; border-radius:3px; padding:0 2px;}

  /* ---------- READER ---------- */
  #screen-reader .screen-inner{padding:20px 22px 310px; max-width:640px; margin:0 auto;}
  .chapter-label{font-size:12px; color:var(--accent-deep); font-weight:600; letter-spacing:.04em; margin-bottom:6px;}
  body.dark .chapter-label{color:var(--accent);}
  .chapter-title{
    font-family:'Noto Serif Bengali',serif; font-weight:700; font-size:24px; margin:0 0 22px; line-height:1.4;
  }
  .chapter-body p{
    font-family:'Noto Serif Bengali',serif;
    line-height:2; margin:0 0 20px; text-align:justify;
  }
  .chapter-body p strong{font-weight:700; color:var(--accent-deep);}
  body.dark .chapter-body p strong{color:var(--accent);}
  .clr-blue{color:#2b5fad;}
  .clr-green{color:#1f7a4d;}
  .clr-red{color:#c0392b;}
  body.dark .clr-blue{color:#6ea8ff;}
  body.dark .clr-green{color:#5fd68e;}
  body.dark .clr-red{color:#ff8a75;}
  .chapter-body p.highlighted{background:rgba(184,134,59,.18); border-radius:6px;}

  .reader-nav{
    position:fixed; bottom:18px; left:0; right:0; z-index:9999;
    display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--paper); border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
  }
  body.dark .reader-nav{background:var(--dark-surface); border-color:var(--dark-line);}
  .nav-btn{
    flex:1; padding:12px; border-radius:11px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font-family:inherit; font-size:13.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  body.dark .nav-btn{border-color:var(--dark-line); color:var(--dark-ink);}
  .nav-btn:disabled{opacity:.35;}

  .progress-track{
    position:fixed; top:0; left:0; right:0; height:3px; z-index:25;
    background:transparent;
  }
  .progress-fill{height:100%; background:var(--accent); width:0%; transition:width .15s;}

  /* ---------- SETTINGS SHEET ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:31;
    background:var(--paper); border-radius:20px 20px 0 0;
    padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%); transition:transform .25s ease;
  }
  body.dark .sheet{background:var(--dark-surface);}
  .sheet.open{transform:translateY(0);}
  .sheet-title{font-weight:600; font-size:15px; margin-bottom:16px;}
  .sheet-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .fontsize-controls{display:flex; align-items:center; gap:14px;}
  .fs-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font-size:15px; cursor:pointer;
  }
  body.dark .fs-btn{border-color:var(--dark-line); color:var(--dark-ink);}
  .toggle{
    width:46px; height:26px; border-radius:20px; background:var(--line);
    position:relative; cursor:pointer; border:none;
  }
  body.dark .toggle{background:var(--dark-line);}
  .toggle.on{background:var(--accent-deep);}
  .toggle-knob{
    position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; transition:left .2s;
  }
  .toggle.on .toggle-knob{left:23px;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="topbar" id="topbar" style="display:none;">
    <button class="icon-btn" id="backBtn" aria-label="ফিরে যান">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="topbar-title" id="topbarTitle">আয়না ঘরে হেফজখানা</div>
    <button class="icon-btn" id="settingsBtn" aria-label="সেটিংস">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0015.4 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.14.36.44.63.8.8.36.13.65.4.8.76"/></svg>
    </button>
  </div>

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="cover-wrap">
      <div class="cover-mark" id="coverInitial">আ</div>
      <div>
        <div class="cover-title" id="bookTitle">আয়না ঘরে হেফজখানা</div>
        <div class="cover-author" id="bookAuthor">হাফেজ মুহাম্মদ আব্দুল আহাদ</div>
      </div>
      <div class="cover-divider"></div>
      <div class="cover-progress" id="coverProgress">এখনও পড়া শুরু হয়নি</div>
      <div class="cover-actions">
        <button class="btn-primary" id="continueBtn">পড়া শুরু করুন</button>
        <button class="btn-secondary" id="tocBtnHome">সূচিপত্র দেখুন</button>
        <button class="btn-secondary" id="searchBtnHome">বইয়ের ভেতর খুঁজুন</button>
      </div>
    </div>
  </div>

  <!-- TOC -->
  <div class="screen" id="screen-toc">
    <div class="toc-list" id="tocList"></div>
  </div>

  <!-- SEARCH -->
  <div class="screen" id="screen-search">
    <div class="search-bar-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="বইয়ের ভেতর যা খুঁজছেন তা লিখুন...">
    </div>
    <div id="searchArea">
      <div class="search-hint">অন্তত ২ অক্ষর টাইপ করুন খোঁজা শুরু করতে</div>
    </div>
  </div>

  <!-- READER -->
  <div class="screen" id="screen-reader">
    <div class="screen-inner">
      <div class="chapter-label" id="chapterLabel">অধ্যায় ১</div>
      <div class="chapter-title" id="chapterTitle"></div>
      <div class="chapter-body" id="chapterBody"></div>
    </div>
  </div>

</div>

<div class="reader-nav" id="readerNav" style="display:none;">
  <button class="nav-btn" id="prevChapterBtn">← আগের অধ্যায়</button>
  <button class="nav-btn" id="nextChapterBtn">পরের অধ্যায় →</button>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="settingsSheet">
  <div class="sheet-title">রিডিং সেটিংস</div>
  <div class="sheet-row">
    <span>ফন্টের আকার</span>
    <div class="fontsize-controls">
      <button class="fs-btn" id="fsMinus">এ−</button>
      <button class="fs-btn" id="fsPlus">এ+</button>
    </div>
  </div>
  <div class="sheet-row">
    <span>ডার্ক মোড</span>
    <button class="toggle" id="darkToggle"><span class="toggle-knob"></span></button>
  </div>
</div>

<script>
/* =====================================================================
   এখানে আপনার বইয়ের তথ্য ও অধ্যায়সমূহ বসান
   ===================================================================== */
const BOOK = {
  title: "আয়না ঘরে হেফজখানা",
  author: "হাফেজ মুহাম্মদ আব্দুল আহাদ",
  chapters: [
    {
      title: "শুরুর কথা",
      paragraphs: [
        "বিসমিল্লাহির রহমানির রহিম।",
        "সকল প্রশংসা মহান আল্লাহ তাআলার, যিনি মানবজাতির হিদায়াতের জন্য সর্বশ্রেষ্ঠ নিয়ামত পরম পবিত্র আল-কোরআন নাজিল করেছেন। আর অসংখ্য দরুদ ও সালাম আমাদের প্রিয় নবী রাসূলুল্লাহ (সা.)-এর প্রতি, যিনি আমাদের পরম ভালোবাসায় এই আসমানি আলো পৌঁছে দিয়েছেন।",
        "‘হাফেজে কোরআন’—এই দুটি শব্দ কেবল একটি জাগতিক সম্মান বা সাধারণ উপাধি নয়; এটি হলো আল্লাহর কালাম বুকে ধরে রাখার এক মহাজাগতিক আমানত। যে শিশুটি তার নিষ্পাপ শৈশবে খেলার মাঠ আর মা-বাবার কোলের মায়া ছেড়ে কোরআন সিনায় ধারণ করার কঠিন যুদ্ধে নেমে পড়ে, তার প্রতিটা ফোঁটা চোখের পানি আর ক্লান্তি স্বয়ং রাব্বুল আলামিন পরম ভালোবাসায় হিসাব করে রাখেন।",
        "এই বইটি কেবল কিছু তথ্যের সমাহার বা পাণ্ডিত্য জাহিরের মাধ্যম নয়; এটি হৃদয় থেকে লেখা কিছু আবেগ ও ভালোবাসার আকুলতা। মাদ্রাসার বারান্দায় বসে যখন কোনো মাসুম ছোট শিশুকে পড়া না পারার কষ্টে নীরবে কাঁদতে দেখি, বাচ্চার খালি বিছানার দিকে তাকিয়ে কোনো মায়ের বুক যখন হু-হু করে ওঠে, কিংবা অল্প বেতনে নিজের সংসার ভুলে নিঃস্বার্থভাবে শিশুদের আলোর পথ দেখানো উস্তাদদের মেহনত দেখি অথবা এই নুরানী সফর টা শেষ হওয়ার আগেই যখন দেখি অন্ধকারে লুকিয়ে থাকা কিছু ছায়াময় কারনে নিষ্পাপ শিশু গুলা ঝরে পরছে তখন মনের ভেতর থেকে এই কথাগুলো জেগে ওঠে।",
        "সেই মেহনত, কান্না আর ভালোবাসাকে এক সুতোয় গাঁথতেই এই বইটির জন্ম। বইটিতে হাফেজে কোরআনের মহান ফযিলতের পাশাপাশি—সন্তানকে কীভাবে মানসিকভাবে সাহস দিতে হয়, পড়া মনে রাখার বাস্তবসম্মত উপায় কী, উস্তাদ ও মুহতামিম সাহেবের সুসম্পর্ক কেমন হওয়া উচিত এবং পুরো জীবন কীভাবে কোরআনের আমানত রক্ষা করতে হয়—তা খুব সহজ ও দরদী ভাষায় ফুটিয়ে তোলার চেষ্টা করা হয়েছে।",

        "অথচ জান্নাতের বিল্ডিংয়ের একেকটা ইটের দাম এত যে, এই গোটা সাত আসমান ও সাত জমিনকে সাতবার বিক্রি করলেও জান্নাতের একটা ইটের দাম হবে না। সেখানে একজন আমলওয়ালা হাফেজকে ৬৬৬৬ তলাবিশিষ্ট অট্টালিকা দান করা হবে।",
        "আজকে আমরা দুনিয়াতে একটা ক্ষণিকের নিবাস স্থাপন করার জন্য কত মেহনতই না করি, দিনকে দিন মনে করি না, রাতকে রাত মনে করি না, মাথার ঘাম পায়ে ফেলি একটা ক্ষুদ্র, দুর্বল ও অস্থায়ী বাড়ি করার জন্য। অথচ একজন হাফেজের কত মর্যাদা যে, তাকে এত দামি একটি স্থায়ী অট্টালিকা দান করা হবে, যার কোনোদিনই শেষ হবে না, পুরাতন হবে না, কোনো দুর্যোগে সেটা ভঙ্গুর হবে না।",
        "নবী কারিম (সা.) বলেছেন, যে কুরআন শিখেছে ও তদনুযায়ী আমল করেছে, কিয়ামতের দিন তার পিতা-মাতাকে এমন একটি নূরের মুকুট পরানো হবে, যার আলো সূর্যের আলো হতেও অধিক উজ্জ্বল হবে। যদি সেই সূর্যটা তোমাদের ঘরে হয়।",
        "অর্থাৎ, সূর্য এত দূরে থাকা সত্ত্বেও তার আলো কত উজ্জ্বল, আর সেই সূর্য যদি ঘরে নেমে আসে, তাহলে তো তার আলো নিঃসন্দেহে হাজার গুণ বেড়ে যাবে। নবীজি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম সেই সূর্যের কথা বলেননি, বলেছেন তার চেয়েও উজ্জ্বল। পিতা-মাতা শুধু হাফেজ সন্তানটির দুনিয়ায় আসার মাধ্যম মাত্র, তাই তাদের যদি এত সম্মান হয়, তাহলে সেই হাফেজটির কত সম্মান হবে, সেটা তোমরা নিজেরাই অনুমান করো।",
        "এরকম আরও হাজারো ফযিলত আছে হাফেজে কুরআনের জন্য। সবচাইতে বড় কথা হচ্ছে, যে অন্তরে কুরআন থাকবে, আল্লাহ তাআলা সেই অন্তরকে জাহান্নামের আগুনে পোড়াবেন না।"
      ]

    {
      title: "আয়না ঘরে হেফজখানা",
      paragraphs: [
        "হাফেজে কুর-আন সম্পর্কে তো জানা হলো। একজন হাফেজের কত দাম, কত মর্যাদা, কত ফজিলত, কত সম্মান তাইনা! তাহলে এত মর্যাদা এত সম্মান থাকা সত্ত্বেও আমরা কেন পড়তে চাইনা, মাদ্রাসায় যেতে চাইনা, এত ফজিলত থাকা সত্ত্বেও কেন তলবে এলেমগুলা দ্বীনের রাস্তা থেকে ঝরে যাচ্ছে। চলো তাহলে সেই কারণগুলোই খুঁজে বের করার চেষ্টা করা যাক।",
        "প্রথমত শয়তানতো মানুষের প্রকাশ্য দুশমন, সে তো আল্লাহ তায়ালার কাছে চ্যালেঞ্জ করেই এসেছে যে, আমি আপনার সব বান্দাদেরকে আমার সাথে জাহান্নামে নিয়ে যাব। সে কি কখনো চাইবে যে, একজন হাফেজে কুরআন জান্নাতে যাক এবং সাথে তার আত্মীয়-স্বজনদের মধ্যে থেকে আরো দশজন জাহান্নামীর আসামিকে সুপারিশ করে জান্নাতে নিয়ে যাক? কখনোই চাইবে না। শয়তান যেকোনো মূল্যে হলেও একজন তলবে এলেমকে দ্বীনের রাস্তা থেকে সরানোর চেষ্টা করবে।",
        "তাই শয়তান মনের ভেতরে কুমন্ত্রণা দেবে যে, দেখ তোর মা-বাবা তোকে কোন জেলখানায় রেখে গেছে — যেখানে না আছে কোনো আনন্দ-উল্লাস, না আছে বন্ধু-বান্ধবের ঘোরাফেরার সঙ্গ, আর না আছে খেলাধুলা — মৌজ-মাস্তির মতো বাহিরের অন্য সব বন্ধুবান্ধবের মতো স্বাধীন একটা জীবন। শুধু পড়া আর পড়া! পড়া আর পড়া! হুজুর সারাদিন চিল্লায় শুধু পড়ো পড়ো, টেবিলে হাত থাপড়ায় আর চিল্লায় — এই পড়া নিয়ে আয়রে — এই ফিরোজ — এই জুনায়েদ — এই তাফসির জলদি ছবক নিয়ে আয় তাড়াতাড়ি — সাত ছবক নিয়ে আয়। এক মিনিটের মধ্যে আমুখতা নিয়ে আয় — আমি উঠলাম কিন্তু! ধুর!! সারাদিন হুজুরের এই ভেগর ভেগর আর ভালো লাগে না। সারাদিনই তো পড়ি, সেই রাত তিনটায় উঠে পড়া শুরু করেছি — সারাদিনই ট্রেন চলতেছে, সেই রাত দশটায় ঘুমানোর আগ পর্যন্ত। সারাদিনই পড়ি, তাও হুজুরের মন পাই না।",
        "বাদ দেই! সারা বছর এই জেলখানায় বন্দি থাকার পরে, বছর শেষে ছুটিতে একটু বাড়িতে যাব তাও শান্তি নাই। বাড়ির লোকজন এতদিন পরে দেখে একটু বলবে যে, বাবা তোর কি খবর, শরীর ঠিক আছে তো? ঠিক মতো খাওয়া-দাওয়া, ঘুম-গোসল হয়তো? আমাদের ছাড়া তোর দিনগুলো কেমন কাটে? তা না, কোনো খোঁজখবর নেওয়ার নাম নেই! প্রথমেই আমাদের সকলের অপছন্দনীয় প্রশ্ন — তোর পড়াশোনার কি অবস্থা? মোট কয় পারা পড়লি এই বছরে? এরপরেই আমাদের সকলের দুশমন সেই বিটকেল প্রশ্নটা — পরীক্ষার ফলাফল কী? ধুর! আর কত সহ্য করব, সারা বছর তো পড়তে পড়তে শেষ, বাড়িতে এসেও শান্তি নাই! অথচ আমার গ্রামের সব ছেলে-পেলেরাই ভালো, সকালে স্কুলে যায় আবার বিকেলেই চলে আসে। মনে চাইলে স্কুলে যাচ্ছে, মনে চাইলে বাড়িতে থাকতেছে। একদম স্বাধীন, মন চাহে জিন্দেগি। যখন যা মনে চাচ্ছে তাই করতেছে — খেলাধুলা, মৌজ-মাস্তি, ঘোরাফেরা, হাসি-তামাশা, যখন যা মনে চায়। আর আমি সারা বছর জেলখানায় পচে মরতেছি!!",
        "আর একটু বয়স হয়ে গেলে তো কোনো কথাই নাই। আর কতদিন, কতদিন হেফজখানায় থাকব। বয়স তো কম হলো না, সতেরো-আঠারো হয়েই যাচ্ছে। হুজুররা বলে হাফেজ হওয়া মানে কেবল লেখাপড়ার শুরু। আবার মাওলানা হতে আট-দশ বছর লাগবে। শুরু করতেই যদি সতেরো-আঠারো বছর লাগে, তাহলে ওগুলো কবে শেষ করব। বাবা তো বৃদ্ধ, কয়দিন আর বুড়া মানুষের গলায় ভর দিয়ে খাব? বাবা যদি কিছুদিন পর একেবারেই চলতে না পারে, তখন তো সংসারের হাল আমাকেই ধরতে হবে। তাহলে এমনিতেই আমার পড়াশোনা কিছুদিন পর বাদ দেওয়াই লাগবে, তার থেকে বরং এখনই বাদ দেই। কাজে গেলে ততদিনে পাকা মিস্ত্রি হয়ে যাব।",
        "এরপরে আরেকটা সমস্যা হলো — এলাকার সব খালাতো ভাইয়েরা ভাবি বানিয়ে ফেলছে। আমার সময় আসবে কবে? বড়ও হয়ে যাচ্ছি! বাড়িতে বলতেও পারছি না! বাড়ি থেকে তো আমাকেই খাইতে দিতে চায় না, পরের মেয়েকে কী দেবে? তার থেকে বরং কাজ-বাজ করে নিজের পায়ে নিজে দাঁড়াই, এরপর নিজের একটা বন্দোবস্ত করি!",
        "এতক্ষণ আলোচনা করলাম শয়তানের তাবলিগি মেহনত ও নসিহতের কথা। চলো আরেকটু খোঁজাখুঁজি করা যাক, আর দেখা যাক চিপায়-চাপায় লুকিয়ে থাকা আর কয়েকটা কারণ বের করা যায় নাকি। এই ফেতনার জামানায় সবচেয়ে বুজুর্গ মানুষই হলো তলবে এলেমরা, হ্যাঁ ঠিক শুনছো, আমরাই! আমাদের জন্যই এই পৃথিবী টিকে আছে। যেদিন আল্লাহ তায়ালার নাম নেওয়ার মতো কেউ থাকবে না, সেদিন আল্লাহ তায়ালা এই পৃথিবী ধ্বংস করে দেবেন। বলতে গেলে এই ফেতনার জামানায় আল্লাহর নাম নেয়, অর্থাৎ আল্লাহ তায়ালার বিধি-বিধানগুলো ঠিকমতো মেনে চলে এমন লোক পাওয়া প্রায় দুর্লভ। কিন্তু তলবে এলেমের মাদ্রাসার রুটিনটা কোনো সাধারণ শিক্ষার রুটিন না। এটা আল্লাহর বিধান মানার জন্য অন্যতম একটা তরতিব। বাড়তি কোনো আমলের প্রয়োজন নেই — কাউকে জান্নাতে নেওয়ার জন্য একটা কওমি মাদ্রাসার নেজামই যথেষ্ট।",
        "কোনো ছাত্র যখন মাদ্রাসায় অধ্যয়নরত অবস্থায় থাকে, তার জন্য মাদ্রাসার নেজাম মানাটা অবশ্যক বটেই, বরং না মেনে চলা প্রায় অসম্ভব। বড় বড় মাদ্রাসায়, বড় বড় জামাতে অনেক ছাত্রের ভিড়ে দু-চার জনের জন্যে ওস্তাদের চোখ ফাঁকি দিয়ে একটু উল্টাপাল্টা করা যদিও সম্ভব হয়, কিন্তু আমার মনে হয় না বাংলাদেশে এমন কোনো মাদ্রাসা আছে যেখানে একটা হেফজখানার ছাত্র হেফজখানার ওস্তাদের চোখ ফাঁকি দিয়ে মাদ্রাসার কোনো নেজাম ভঙ্গ করে নিজের মনমতো চলবে, এমন কোনো সুযোগ আছে। কেননা একটা হেফজখানার ছাত্রের চব্বিশ ঘণ্টাই কাটে ওস্তাদের নেগরানির মাধ্যমে। এখন মাদ্রাসার নেজাম অনুযায়ী যদি কোনো ছাত্র পড়াশোনা করে, মাদ্রাসা যদি কামাই না দেয়, তাহলে একটা ছাত্রের হাফেজ হতে সাধারণত তিন বছর সময় লাগে, যদিও ছাত্রটা দুর্বল হয়। যদি বেশি দুর্বল হয় তাহলে দুই-চার মাস বেশি লাগতে পারে, এটা বড় কোনো ব্যাপার না। কিন্তু দেখা যায় চার-পাঁচ, এমনকি ছয় বছরও লাগে অনেক মাদ্রাসার অনেক ছাত্রের হাফেজ হতে। আমাদের মাদ্রাসায় একবার এক ছাত্র ভর্তি হয়েছিল, সে কোন মাদ্রাসায় পড়ত আল্লাহ তাআলাই ভালো জানেন! ওই বেচারা নাকি সাত বছরে বারো পারা হেফজ করেছে, তাও ইয়াদ নাই!",
        "কেন রে ভাই, যেখানে একটা দুর্বল ছাত্রেরই হেফজ সম্পূর্ণ করতে তিন থেকে সাড়ে তিন বছর লাগার কথা, সেখানে এত বছর লাগছে কেন? আমার জানামতে কোনো ছাত্রের এতটা দুর্বল হওয়ার কথা না, যে হেফজ শেষ করতে ছয়-সাত বছর সময় লাগবে, তাও আবার ইয়াদ ছাড়া! আর যদি সত্যিই এতটা দুর্বল হয়, তাহলে হেফজ পড়ার দরকার কী? কারণ হাফেজ হওয়া ফরজ না, কিন্তু হাফেজ হলে ইয়াদ রাখাটা ফরজ। এত বছর কষ্ট করে লাভ কী? বাবা-মার টাকা-পয়সা নষ্ট করে লাভ কী, যদি এমন হাফেজ হই ইয়াদই না থাকে! কারণ হাফেজ হওয়া তো ফরজ না! কিন্তু এত বছর সময় নষ্ট না করে হেফজখানার এই সময়টায় কিতাব বিভাগে ভর্তি হলে ছাত্রটার প্রায় মাওলানার কাছাকাছি পর্যন্ত পড়া হয়ে যায়।",
        "এই যে ছাত্রদের হাফেজ হতে এত সময় লাগছে, আবার ইয়াদও থাকছে না — আমার মনে হয় এগুলো ছাত্রদের দুর্বলতার দোষ না, এগুলো মাদ্রাসার নেজামের দোষ, এগুলো ওস্তাদদের নেগরানির দোষ! হয়তো মাদ্রাসার নেজাম বা তরতিবের মধ্যে কোনো সমস্যা আছে, অথবা ওস্তাদদের মধ্যে গাফেলতি আছে। হ্যাঁ, শুনতে কষ্ট হলেও এটাই বাস্তব!",
        "আর ইয়াদ না থাকার যে কষ্ট! না সামনে আগাতে মন চায়, আর না বাড়ির চাপে চুপ মেরে থাকা যায়। কারণ বছর শেষে তো ঠিকই হিসাব চাইবে — এই বছরে কয় পারা পড়লি? নাহিদ তো এই বছরে দশ পারা পড়ল, ফিরোজ তো এই বছরে পনেরো পারা পড়ল, তুই কয় পারা পড়লি? মনের মধ্যে কোনো শান্তি থাকে না। খেতে বসতে, চলতে-ফিরতে, সব সময় কেমন জানি অস্থির অস্থির লাগে। বাহির থেকে মাদ্রাসায় কোনো মেহমান আসলে বুকের ভেতর ধুকধুক শুরু হয়ে যায় — না জানি বোর্ডের কোনো হুজুর আসলো বোধহয়, যদি ইমতেহান চায়! কোনো হাফেজ সাহেবকে দেখলে তো কোনো কথাই নাই, নিজেকে আড়াল করে কোনোমতে পাশ কাটিয়ে যেতে পারলেই বাঁচি! আবার যদি কোনো প্রশ্ন করে বসে! ছবক পড়ার সময় মাথার মধ্যে ঘুরপাক খায় — ইশ! আমি সামনে তো আগাচ্ছি, পেছনের পারাগুলোর যে অবস্থা!",
        "এই টেনশনে ছবকও ভালোভাবে হয় না, ফলে সাত-ছবকও কাঁচা হয়ে যায়। আর সাত-ছবক কাঁচা মানে পারা কাঁচা। এভাবে পেছনের কাঁচা পারার সাথে সাথে নতুন পারাগুলোও কাঁচা হতে হতে যায়। একদিকে পারা বাড়ে, অপরদিকে টেনশন বাড়ে। এমতাবস্থায় শয়তানের সেই ওয়াজ-নসিহতগুলো মনের ভেতর আরো শেকড় গেড়ে বসে। একটা সময় দেখা যায় যে, ছাত্রটার পড়াশোনা শেষ!",
        "বলতে পারো, আমি এসব কথা জানলাম কেমনে? আসলে আমি কারো মুখে শোনা কথা বলছি না, আমি আমার নিজের জীবনের বাস্তব অভিজ্ঞতা থেকে বলছি। আমিও জীবনে অনেকবার অনেক ধাক্কা খেয়েছি। আর সেই ধাক্কাগুলো থেকে একটা একটা করে শিক্ষা গ্রহণ করেছি।",
        "আসলে প্রতিকূলতা মানুষকে সভ্যতা শেখায়। অন্ধকারের প্রতিকূলতা মানুষকে আলোর দিশা দিয়েছে, বন-জঙ্গলের হিংস্র প্রাণীর ভয়ের প্রতিকূলতা মানুষকে আশ্রয়স্থলের সভ্যতা শিখিয়েছে। আমরা সকলেই তো বৈদ্যুতিক বাতি ব্যবহার করি, এর আবিষ্কারের ইতিহাস কি জানো? চলো একবার ইতিহাস থেকে ঘুরে আসি।",
        "লাইট যে আবিষ্কার করেছেন — থমাস আলভা এডিসন। তিনি একটি থিওরি আবিষ্কার করলেন যে, এভাবে এভাবে করলে এই লাইটটা জ্বলবে। তিনি সেই অনুযায়ী কাজ করলেন, কিন্তু লাইটটা জ্বললো না। তিনি আবার চেষ্টা করলেন, কিন্তু তাও জ্বললো না। আবার চেষ্টা করলেন, এবারও ব্যর্থ! কিন্তু তবুও তিনি হতাশ হলেন না, তিনি তাঁর চেষ্টা চালিয়ে যেতে লাগলেন। একের পর এক চেষ্টা চালিয়ে যেতে লাগলেন — একভাবে ব্যর্থ হচ্ছেন, অন্যভাবে চেষ্টা করছেন। এভাবে চেষ্টা চালাতে চালাতে যখন তাঁর চেষ্টা করার সংখ্যা দাঁড়িয়েছে নয়শ নিরানব্বই, তখনও তিনি ব্যর্থ, এখনো সফল হতে পারেননি। তাও তিনি হাল ছাড়ার পাত্র নন! তিনি তাঁর চেষ্টা চালিয়েই যাবেন! যখন তিনি আরেকবার চেষ্টা করলেন — অর্থাৎ তাঁর চেষ্টা করার সংখ্যা এখন এক হাজার — তখন বেচারা সফল হলেন। তো সবশেষে তাঁকে যখন প্রশ্ন করা হলো, \u201cআপনি এতবার ব্যর্থ হওয়ার পরেও হতাশ হননি? পিছপা হননি? আপনি আপনার এই বৃথা চেষ্টাটা থামিয়ে দেননি?\u201d তিনি তখন যে উত্তরটা দিয়েছিলেন, আসলেই তা শোনার মতো ছিল! তিনি তখন বললেন, \u201cকে বলেছে আমি নয়শ নিরানব্বই বার ব্যর্থ হয়েছি? আমি তো লাইটটি না জ্বলার নয়শ নিরানব্বইটি কারণ খুঁজে বের করেছি!\u201d",
        "আসলে তিনি ব্যর্থতার মাঝেই সফল না হওয়ার কারণগুলো চিহ্নিত করেছেন। এটাই আমাদের জীবনের জন্য একটা বড় শিক্ষা — যেকোনো প্রতিকূল অবস্থায় কীভাবে উত্তরণের উপায় খুঁজে বের করা যায়।",
        "অনুরূপভাবে, আমি আমার বাস্তব জীবন থেকে যে অভিজ্ঞতাটুকু পেয়েছি, যে প্রশ্নগুলোর সম্মুখীন হয়েছি এবং যে প্রতিকূল পরিস্থিতি আমি পার করে এসেছি, সেই কারণগুলোই চিহ্নিত করে তোমাদের সাথে শেয়ার করছি। যাতে তোমাদেরও আমার মতো প্রতিকূলতায় ভুগতে না হয় এবং পরবর্তী প্রজন্মকে যেন আবার সেই একই প্রশ্নগুলোর মুখোমুখি হতে না হয় — তার জন্যই আমার এই ছোট্ট প্রয়াস।"
      ]
    },
    {
      title: "কেমন মাদ্রাসায় ভর্তি হওয়া উচিত",
      paragraphs: [
        "ভালো করে পড়াশোনা করার জন্য দরকার ভালো একটা পরিবেশ। একজন ছাত্রের শুধু আগ্রহ আর ভালো মেধা থাকলেই পড়াশোনা ভালো হয় না। তাই যদি হতো, তাহলে তো কোনো ছাত্র তার আগ্রহ ও মেধা খাটিয়ে মাদ্রাসায় না গিয়ে বাড়িতে বসেই হাফেজ বা মাওলানা হয়ে যেত। কিন্তু তা কোনোদিনই সম্ভব নয়। কারণ বাড়িতে তার আগ্রহ ও মেধা খাটানোর মতো পরিবেশ নেই। তাই আগ্রহ ও মেধার পাশাপাশি দরকার পড়াশোনা করার মতো ভালো একটা সুশৃঙ্খল পরিবেশ।",
        "আমাদের ওস্তাদ আল্লামা শাহ আহমাদ আব্দুল গফুর আল হাবিবি (দামাত বারকাতুহু) হুজুর বলতেন, \u201cমাদ্রাসা হলো তিনটি জিনিসের নাম। যে মাদ্রাসায় এই তিনটি জিনিস নেই, সেটি কোনো মাদ্রাসাই না।\u201d এই তিনটি জিনিস হলো — এক, **তালীম (শিক্ষা)**; দুই, **তরবিয়াত (প্রশিক্ষণ ও শিষ্টাচার)**; তিন, **খেদমত (সেবা)**।",
        "**তালীম** হলো লেখাপড়া। অর্থাৎ পড়াশোনার যতগুলো দিক রয়েছে, হেফজ-নাজরা-কিতাবখানার যত পড়াশোনা রয়েছে, সকল পড়াশোনা একত্রে তালীমের ভেতর গণ্য। যেখান থেকে শিক্ষার্থী সঠিক শিক্ষা গ্রহণ করতে পারে। যে মাদ্রাসায় পড়াশোনা ভালো হয় না বা তালীমের মান ভালো না, সেটি ভালো মাদ্রাসা হতে পারে না। অর্থাৎ পড়াশোনা করার জন্য দরকার সুন্দর তালীমী নেজাম (শিক্ষাব্যবস্থা)।",
        "এরপরেই আসে **তরবিয়াত**। ছাত্রদের পড়াশোনা করার জন্য আখলাকি নেজাম। আমল, আখলাক ও পড়াশোনার সুশৃঙ্খল পরিবেশ — এগুলো সবই তরবিয়াতের অন্তর্ভুক্ত। যে মাদ্রাসায় ভালো পড়াশোনার পাশাপাশি ছাত্ররা আমলদার, সুন্দর চরিত্রের অধিকারী এবং সুন্নতের অনুসারী হয়, বুঝতে হবে সে মাদ্রাসার তরবিয়াত ঠিক আছে। নতুবা একটা ছাত্র হাফেজ হচ্ছে, অথচ সে তাহাজ্জুদ পড়ে না, মিসওয়াক করে না, তার কথাবার্তায় সুন্নতি আদব নেই, আর তার লেবাস ও চলাফেরা অশালীন বা ঢিলেঢালা — তাহলে তো হবে না। এজন্যই তালীমের পাশাপাশি তরবিয়াতেরও সমান প্রয়োজন।",
        "এরপরেই হলো সবচেয়ে গুরুত্বপূর্ণ বিষয়টি — **খেদমত**। খেদমত হলো ওস্তাদ, ছাত্র এবং মাদ্রাসা — এই তিনটির পারস্পরিক সম্পর্ক। ওস্তাদ ছাত্রকে মহব্বত ও স্নেহ করবেন, আর ছাত্র ওস্তাদকে মহব্বত ও সম্মান করবে। ওস্তাদ যা বলবেন, ছাত্র তা অক্ষরে অক্ষরে পালন করবে। ওস্তাদের কোনো প্রয়োজন হলে ছাত্র তা বুঝে নিয়ে নিজে থেকেই এগিয়ে দেবে।",
        "ওস্তাদ ও ছাত্র সকলে মিলে মাদ্রাসার দেখভাল করা, মাদ্রাসার আসবাবপত্রের হেফাজত করা, ছাত্ররা ওস্তাদদের অন্যান্য খেদমত এবং মাদ্রাসার যেকোনো কাজে উপস্থিত থাকা — এই সবগুলোই খেদমতের অন্তর্ভুক্ত। মাদ্রাসার যেকোনো দরকারে ডাক দিলে সে ডাকে সাড়া দেওয়া উচিত। তবে তাই বলে পড়াশোনা বাদ দিয়ে সারাদিন খেদমত নিয়েই পড়ে থাকা যাবে না। কোনো প্রয়োজন থাকলে এমন সময় বের করতে হবে যাতে পড়াশোনার কোনো ব্যাঘাত না ঘটে। তবে আমার জানামতে, হেফজখানায় পড়াশোনার ফাঁকে সময় বের করা প্রায় অসম্ভব। কারণ হেফজখানার চব্বিশ ঘণ্টার যে রুটিন, সেটা শিকলের আংটার মতো একটার সাথে আরেকটা যুক্ত। শিকলের প্রতিটি আংটা যেমন দরকারি, তেমনি হেফজখানার চব্বিশ ঘণ্টার প্রতিটি মুহূর্তই গুরুত্বপূর্ণ।",
        "যেহেতু চব্বিশ ঘণ্টাই ছাত্রদের পড়ার সময়, তাই এর মধ্য থেকে অবসর বের করা বলতে গেলে অসম্ভব। এরপরেও মাদ্রাসার খুব জরুরি প্রয়োজনে যদি হঠাৎ একটু সময় দেওয়া হয়, সেটা ভিন্ন কথা। কিন্তু প্রতিদিন ক্লাস বাদ দিয়ে মাদ্রাসার কাজ করা এটা একেবারেই মেনে নেওয়ার মতো নয়। অনেক মাদ্রাসায় মনে করা হয়, ছাত্ররা তো হাফেজ হয়ে যাচ্ছে বা বড় হয়ে যাচ্ছে, অথচ হেফজখানায় তো হেফজের বাইরে অন্য কিছু শেখানো হয় না। তাই হেফজের পাশাপাশি অন্য কিছুও শেখানো দরকার — যেমন রান্নাবান্না, কোনো হাতের কাজ, কিংবা মাসের মধ্যে তাবলীগে নিয়ে গিয়ে দাওয়াতি কাজ করানো।",
        "এই উদ্যোগগুলো নিঃসন্দেহে ভালো। তবে এগুলো করতে গিয়ে যদি মূল পড়াশোনার ব্যাঘাত ঘটে, তবে এই উদ্যোগ বন্ধ রাখাই আমার মনে হয় বুদ্ধিমানের কাজ। কেননা ছাত্রদের অন্যদিকে দক্ষ বানাতে গিয়ে যদি তারা তাদের আসল লক্ষ্যই ভুলে যায়, তবে তার প্রয়োজন কী? তখন সেটা হবে নিত্যদিনের মুখরঞ্জিত পানের সাথে চুন খাওয়ার মতো ব্যাপার — যা আমরা মুখের স্বাদে খাই, কিন্তু মাত্রাতিরিক্ত হলে মুখ জ্বালিয়ে দেওয়ার ক্ষমতা রাখে।",
        "অনেক সময় হেফজখানার ছাত্রদের নসিহত করতে গিয়ে উদাহরণ দেওয়া হয় — বড় বড় মাদ্রাসায় ছাত্ররা কত কাজ করে! হাটহাজারী বা মেখলের ছাত্ররা পাহাড় থেকে কাঠ কেটে নিয়ে আসে। ইতিহাস শোনানো হয় — আগের দিনের ছাত্ররা ওস্তাদদের বাড়ির গরুর জন্য ঘাস কেটে দিত, ওস্তাদদের খেত নিড়িয়ে দিত। ভালো কথা, তবে এসব খেদমত হেফজখানার ছোট ছোট ছাত্রদের ওপর চাপিয়ে দেওয়ার আগে জানতে হবে — যাদের ইতিহাস বলা হচ্ছে, তারা কোন জামাতের ছাত্র ছিল এবং কত বড় ছিল! তাঁদের দৃষ্টান্ত আদৌ হেফজখানার রুটিনের ছোট ছাত্রদের সাথে যায় কি না?",
        "বিষয়টি বুঝতে একটি গল্প বলা যাক। একটি উট পানিতে নেমে গোসল করছে, পানি তার গলা পর্যন্ত। একটি ভেড়া এসে উটকে বলল, \u201cভাই, আমি গোসল করব, কিন্তু সাঁতার তো জানি না। ওখানে কেমন পানি?\u201d উট সত্যি কথাই বলল, \u201cএখানে তো গলা পানি।\u201d এখন ভেড়াটি যদি উটের কথা শুনে ওই পানিতে গোসল করতে নেমে পড়ে, তবে তোমরাই বলো, ভেড়াটি কি আদৌ গোসল করতে পারবে, নাকি পানিতে ডুবে মরবে? কেননা ভেড়াটিকে আগে বুঝতে হবে — যে উটের সাথে সে নিজেকে তুলনা করছে, তার সাথে নিজের শারীরিক তুলনা চলে কি না!",
        "অনুরূপভাবে, হেফজখানার ছোট ছোট ছাত্রদের বড় বড় মাদ্রাসার উঁচু জামাতের ছাত্রদের সাথে তুলনা করে সেসব কাজ এদের ওপর চাপিয়ে দেওয়া মোটেও যুক্তিযুক্ত নয়। কারণ হেফজখানা ও কিতাবখানা দুটো সম্পূর্ণ আলাদা বিভাগ। কিতাবখানায় ক্লাসের সময় নির্দিষ্ট থাকে, কিন্তু হেফজখানায় চব্বিশ ঘণ্টাই পড়ার সময়। এর মধ্য থেকে সময় বের করা প্রায় অসম্ভব। হ্যাঁ, মাদ্রাসার কোনো বিশেষ বা জরুরি প্রয়োজন থাকলে দু-একদিন ব্যতিক্রম হতে পারে। তাই বলে প্রতিদিন ক্লাস টাইমে! না ভাই, এটা কোনোভাবেই মানার মতো না।",
        "যদি ঘন ঘন কাজের জন্য ছাত্রদের ক্লাস টাইম থেকে ডেকে নেওয়া হয়, তবে ক্লাসের ও পড়াশোনার যে গুরুত্ব, তা ছাত্রদের মন থেকে হারিয়ে যায়। যে জিনিস যেখানে দুর্লভ, সেখানে তার কদর বেশি। যেমন পানি — আমাদের দেশে অঢেল আছে বলে আমরা গুরুত্ব বুঝি না। কিন্তু সৌদি আরবের মতো যেসব দেশে পানির তীব্র সংকট, সেখানে জ্বালানি তেলের চেয়েও পানের পানির দাম নাকি বেশি! তারা বোঝে পানির কত দাম, কত গুরুত্ব ও প্রয়োজনীয়তা। তাই তারা পানিকে সেভাবেই কদর করে। কিন্তু আমাদের এখানে যেকোনো কাজে ইচ্ছেমতো পানি খরচ ও অপচয় করা হচ্ছে।",
        "এখন আমাদের এখানে যদি কাউকে নসিহত করা হয় — \u201cভাই, পানি অনেক মূল্যবান জিনিস, পানি নষ্ট কোরো না। অজুর সময় ট্যাপ জোরে ছেড়ে দিও না, গোসলের সময় এক বালতির জায়গায় দুই বালতি পানি ব্যবহার কোরো না\u201d — তখন লোকটি হয়তো বলবে, \u201cধুর! কত পানি কত জায়গায় নষ্ট হচ্ছে, আর কাজের সময় আসলেই আপনারা অপচয় রোধের স্লোগান তোলেন!\u201d",
        "অনুরূপভাবে, ছাত্রদের ক্লাস টাইমের সময়টা যখন ঘন ঘন অন্য কাজে ব্যবহার করা হবে (যদিও তা মাদ্রাসার খাতিরেই হোক না কেন), তখন ছাত্রদের মনেও ঠিক একই প্রশ্ন ঘুরপাক খাবে — এমনিতেই তো কত সময় নষ্ট হয়! পাঁচ মিনিট দেরি করে ক্লাসে বসলে তেমন কী ক্ষতি হবে? একটু পরে এলে কী বা এসে যাবে? কিংবা একদিন অনুপস্থিত থাকলে সমস্যা কোথায়?",

      paragraphs: [
        "আমাদের সবার জানা একটি চিরন্তন সত্য প্রবাদ বাক্য রয়েছে — \u201cছাত্ররা হলো কাঁচা কাদামাটির মতো।\u201d কাদামাটি যতক্ষণ নরম থাকে, একজন কুমার তাকে পরম মমতায় যেভাবে ইচ্ছা মোচড় দিয়ে সুন্দর পাত্র, হাঁড়ি-পাতিল কিংবা গৃহস্থালির রূপ দিতে পারেন। আমাদের এই ছোট ছোট মাসুম শিশুরা ঠিক সেই নরম কাদামাটি, আর উস্তাদ হলেন সেই রূপকার বা কুমার।",
        "উস্তাদ যদি সঠিক মেহনত আর ভালোবাসা ঢেলে দেন, তবে তিনি তাঁর ছাত্রকে জীবনের সবচেয়ে আলোকময় মানুষ হিসেবে গড়ে তুলতে পারেন। সেই পাত্রটি যেমন চিরকাল মানুষের উপকারে আসে এবং তার সমস্ত সৌন্দর্য কুমারের প্রশংসা বয়ে আনে, তেমনি একজন দরদি উস্তাদের মেহনতের ফলও দুনিয়া ও আখেরাতে উজ্জ্বল হয়ে থাকে। কিন্তু কুমার যদি সেই কাদামাটি নিয়ে কাজ না করে অলসতা ও অবহেলায় ফেলে রাখেন, তবে মাটি একসময় শুকিয়ে শক্ত ঢিলে পরিণত হয়। তখন তাকে দিয়ে আর কোনো সুন্দর রূপ দেওয়া সম্ভব হয় না; তা কেবল পথের প্রান্তে পড়ে থাকা একখণ্ড অর্থহীন পাথর হয়ে রয়।",
        "**কড়া তেতো সত্য ও আসমানী আমানত।** কথাগুলো হয়তো শুনতে একটু তেতো লাগছে! কিন্তু পেটের কৃমি মারতে যেমন তিতা ওষুধ ছাড়া উপায় থাকে না, তেমনি এই তেতো সত্যটাও আজ আমাদের মেনে নিতে হবে। কারণ উস্তাদদের ভেতরের কিছু গাফিলতিরূপী কৃমির পার্শ্বপ্রতিক্রিয়ায় আজ ধ্বংস হয়ে যাচ্ছে হাজার হাজার আলেমে দ্বীন বা হাফেজে কোরআন হওয়ার সম্ভাবনাময় জীবন।",
        "এখনকার সময়ে বেশিরভাগ শিশুই নিজের ইচ্ছায় মাদ্রাসায় আসে না; প্রায় নিরানব্বই শতাংশ ছাত্রই পরিবারের চাপে পড়ে মাদ্রাসায় ভর্তি হয়। আমরা ওয়াজ-নসিহতে ছাত্রদের কত সুন্দর করে বলি — \u201cআল্লাহ তাআলা দুনিয়ার লাখ লাখ মানুষের ভিড় থেকে বাছাই করে তোমাকে তাঁর কোরআনের জন্য বেছে নিয়েছেন।\u201d এটি যেমন সত্য, তেমনি উস্তাদদেরও বোঝা উচিত — দেশজুড়ে হাজার হাজার মাদ্রাসা ও উস্তাদ থাকা সত্ত্বেও মহান আল্লাহ ওই নির্দিষ্ট ছাত্রটিকে পড়ার জন্য আপনার কাছেই পাঠিয়েছেন! ছাত্রটি যতবার কোরআন তিলাওয়াত করবে, যত আমল করবে, তার নেকির একটি অংশ উস্তাদের আমলনামায় যুক্ত হবে। আল্লাহ উস্তাদকেও ভালোবেসে এই মহা নিয়ামত দিয়েছেন। সুতরাং প্রতিটি ছাত্র উস্তাদের কাছে এক একটি আসমানী আমানত।",
        "**উস্তাদদের কিছু প্রাত্যহিক ও নীরব গাফিলতি।** উস্তাদ যখন এই আমানতের কদর ভুলে যান, তখনই তৈরি হয় নানা রকম গাফিলতি।",
        "**দুর্বল ছাত্রদের প্রতি বৈষম্য:** যে ছাত্রটি সহজে সবক দেয়, তাকে সবাই ভালোবাসে। কিন্তু যে ছাত্রটি মেধা বা অসুস্থতার কারণে পিছিয়ে পড়ে, তার প্রয়োজন উস্তাদের একটু বাড়তি ধৈর্য, সময় ও চোখের পানির দোয়া। দুর্বলকে অবহেলা করে \u201cতোকে দিয়ে কিছু হবে না\u201d বলে মানসিকভাবে ভেঙে দেওয়া একজন শিক্ষকের সবচেয়ে বড় ব্যর্থতা।",
        "**শাসনের নামে নিষ্ঠুরতা ও প্রহার:** পড়া না পারলে রাগের মাথায় অতিরিক্ত প্রহার বা কটু কথা বলা একেবারেই অনুচিত। শাসনের উদ্দেশ্য হওয়া উচিত সংশোধন, প্রতিশোধ নয়। মারধরের ভয়ে সাময়িক পড়া আদায় হতে পারে, কিন্তু শিশুর ভেতরের পড়ার আনন্দ ও মাদ্রাসার প্রতি ভালোবাসা চিরতরে মরে যায়।",
        "**ছাত্রদের মানসিক অবস্থার খবর না রাখা:** ছোট শিশুরা পরিবার ছেড়ে মাদ্রাসায় থাকে। অনেক সময় শারীরিক অসুস্থতা, একাকিত্ব বা মন খারাপের কারণে তারা পড়া দিতে পারে না। তাদের সমস্যার গভীরে না গিয়ে শুধু সাজা দিলে উস্তাদের প্রতি শ্রদ্ধা হারিয়ে যায়। উস্তাদকে হতে হবে বাবার মতো স্নেহশীল।",
        "**অমূল্য সময় নষ্ট ও ব্যক্তিগত কাজে ব্যবহার:** ক্লাসের সময়ে উস্তাদ যদি নিজের কাজে ব্যস্ত থাকেন কিংবা ছাত্রদের দিয়ে ঘন ঘন নিজের ব্যক্তিগত কাজ করান, তবে ছাত্রের মন থেকে পড়াশোনার কদর মুছে যায়। উস্তাদ নিজেই সময়ে ক্লাসে না এলে ছাত্রকে শাসন করার নৈতিক অধিকার হারিয়ে ফেলেন; তখন ছাত্রের মনেও ফাঁকি দেওয়ার প্রবণতা জাগে।",
        "**নিয়মিত সবক ও ইয়াদের হিসাব না নেওয়া:** প্রতিদিনের পড়া প্রতিদিন না নেওয়া বা খেয়ালখুশি মতো ক্লাস চালানো। নিয়মিত তদারকি না থাকলে ছাত্ররা অলস হয়ে পড়ে এবং ধীরে ধীরে পেছনের পড়া দুর্বল হয়ে পুরো শিক্ষাজীবন এলোমেলো হয়ে যায়।",
        "**ছাত্রদের সামনে ক্ষোভ ও হতাশা উগরে দেওয়া:** অনেক সময় উস্তাদরা মাদ্রাসার পরিচালনা, মুহতামিম সাহেবের সিদ্ধান্ত, কম বেতন বা খাবারের মান নিয়ে ছাত্রদের সামনে আক্ষেপ করেন। এতে ছাত্ররা ভাবতে শুরু করে — \u201cএত কষ্ট করে পড়াশোনা করে শেষমেশ হুজুরদের মতো এমন কষ্টই তো করতে হবে, তাহলে পড়ে লাভ কী?\u201d শয়তান এই সুযোগে তাদের মনে কুচিন্তা ঢুকিয়ে দেয় এবং একসময় ছাত্রটি পড়ালেখাই ছেড়ে দেয়।",
        "**উস্তাদদের প্রতি আকুল নিবেদন।** উস্তাদদের জীবনে নানা রকম পারিবারিক বা আর্থিক সমস্যা থাকতেই পারে। মাদ্রাসার চাকরি ভালো না-ই লাগতে পারে। কিন্তু নিজের সমস্যার অসিলায় অবহেলা করে নিরীহ ছাত্রদের জীবন নষ্ট করা কোনোভাবেই মানা যায় না।",
        "আমি আপনাদের পায়ে হাত রেখে বিনয়ের সাথে আকুতি জানাই — যতদিন মন থেকে ভালো লাগবে, আল্লাহকে ভালোবেসে এই মহান দায়িত্ব পালন করুন। আর যখন ভালো লাগবে না, দয়া করে সম্মানজনকভাবে চাকরি ছেড়ে অন্য কিছু করুন; কিন্তু আল্লাহর দেওয়া এই মাসুম আমানতগুলোর ভবিষ্যৎ ধ্বংস করবেন না। উস্তাদের মুখের এক চিলতে ভালোবাসা একটি দিশেহারা শিশুকে বিশ্বজয়ী হাফেজ বানিয়ে দিতে পারে, আবার সামান্য গাফিলতি একটি সম্ভাবনাময় দীপ্ত কুঁড়িকে ফোটবার আগেই ঝরিয়ে দিতে পারে।"
      ]

    {
      title: "মুহতামিম সাহেবের দায়িত্ব ও শিক্ষকদের সাথে ব্যবহার: দুর্গের প্রধান যখন দরদী অভিভাবক",
      paragraphs: [
        "একটি মাদ্রাসা কেবল কোনো ইট-পাথরের ভবন নয়; এটি রাব্বুল আলামিনের দ্বীন ও কোরআন সংরক্ষণের এক দুর্ভেদ্য দুর্গ। আর একজন মুহতামিম সাহেব হলেন সেই দুর্গের সিপাহসালার এবং পুরো রুহানি পরিবারের প্রধান অভিভাবক। একজন বাবা যেমন তাঁর ঘরের প্রতিটি সন্তানের সুখ-দুঃখের খেয়াল রাখেন, একজন মুহতামিম সাহেবের দায়িত্বও ঠিক তেমনই সুগভীর।",
        "**মাদ্রাসাকে প্রতিষ্ঠান নয়, দ্বীনি পরিবার মনে করা**",
        "আজকাল অনেক ক্ষেত্রে মাদ্রাসার পরিচালনাকে কোনো অফিসের মতো বানিয়ে ফেলা হয়। কিন্তু উস্তাদরা তো সাধারণ কোনো কর্মচারী নন; তাঁরা হলেন মহান নবীজির (সা.) আমানত ও ইলমের ওয়ারিশ। বাজারে সামান্য আট-দশ হাজার টাকার সম্মানীতে নিজের সংসার আর জীবনের কত শত স্বপ্ন বিসর্জন দিয়ে তাঁরা এই দ্বীনের খাদেম হয়ে পড়ে থাকেন। মুহতামিম সাহেবের প্রথম কাজ হলো শিক্ষকদের ‘মালিক-কর্মচারী’ দৃষ্টিতে না দেখে পরম স্নেহের ভাই বা সন্তানের মতো ভালোবাসা দেওয়া।",
        "**শিক্ষকদের মর্যাদা ও আত্মসম্মান রক্ষা করা**",

                "নতুন একটা ছোট বাচ্চা যখন মক্তব থেকে হেফজখানায় আসে, শুরুতে আগ্রহ থাকলেও দিন দিন পড়ার চাপ বাড়লে সে হেফজখানার প্রতি ভীতি পোষণ করতে শুরু করে। এই সময়ে উস্তাদের সর্বপ্রথম কাজ থাকে যেকোনো উপায়ে বাচ্চার পড়ার প্রতি আবার আগ্রহ পয়দা করা।",
                "সবচেয়ে ভালো উপায় হলো, সমান সময়ে আসা অন্য সাথী ভাইয়ের সাথে একটি সুস্থ প্রতিযোগিতামূলক আবহ তৈরি করা (যেমন: “দেখো তোর ওই সাথী ভাইটা কত এগিয়ে গেল, তুই এখনো পিছিয়ে আছিস!”)।",
                "যে বাচ্চা আগে পড়া শেষ করবে, তার জন্য প্রয়োজনে উস্তাদের পক্ষ থেকে ছোটখাটো একখণ্ড হাদিয়ার ব্যবস্থা করা। এতে ছাত্ররা আগ্রহটা আরো বেড়ে যায়।",
                "**{{b}}৩. মৌলিক পরিভাষার সাথে পরিচয় করানো{{/b}}**",
                "ছাত্রটি যেহেতু নতুন এসেছে, সে জানে না কোনটা কী এবং কখন কী করতে হয়। উস্তাদের দায়িত্ব থাকবে পরম মমতায় বুঝিয়ে দেওয়া—কোনটাকে ‘সবক’ বলে, কোনটাকে ‘সাত সবক’ বলে, কোনটাকে ‘আমুখতা’ বলে এবং কোনটা কীভাবে মুখস্থ করতে হয়।",
                "**{{b}}দৈনন্দিন আদর্শ রুটিন ও আমল{{/b}}**",
                "**{{b}}আসরের আগে (সবক দেখে নেওয়া):{{/b}}** আসরের ১৫-২০ মিনিট আগে থেকে নতুন সবকের পৃষ্ঠাটি ভালোভাবে দেখে নেওয়া। এমনভাবে নাজেরা পড়বে, যেন প্রায় অর্ধেক মুখস্থ হয়ে যায়। পড়া শেষে উস্তাদ বা ওই পৃষ্ঠা পড়া কোনো সাথী ভাইয়ের কাছে ধরিয়ে নেওয়া এবং লোকমা (ভুল) গেলে তখনই তা সংশোধন করে নেওয়া।",
                "**{{b}}মাগরিব থেকে এশা (সবক ইয়াদ করা):{{/b}}** মাগরিবের নামাজ পর মসজিদে কোনো আমল থাকলে তা সম্পূর্ণ করে, মসজিদ থেকে বের হয়ে কারো সাথে কোনো কথা না বলে দরূদ শরীফ পড়তে পড়তে রুমে চলে আসা। এরপর কোরআন শরিফটি হাতে নিয়ে ‘রব্বি যিদনী ইলমা’ পড়তে পড়তে খোলা এবং চেষ্টা করা এক বসাতেই সবকটি ভালো করে ইয়াদ করার। এশার আগেই প্রস্তুতকৃত সবক সাথী ভাইকে শোনানো; কোনো লোকমা পড়লে তখনই তা শুধরে নেওয়া (প্রয়োজনে আরেকবার ধরানো)। এরপর রাতের খাওয়া-দাওয়া শেষ করে এশার নামাজের প্রস্তুতি নিয়ে মসজিদে চলে যাওয়া। এরপর এশার নামাজ শেষ করে মসজিদে কোনো আমল থাকলে তা সম্পূর্ণ করে রুমে চলে আসা।",
                "**{{b}}এশার পরের আমল:{{/b}}** এশার পর থেকে ঘুমানোর আগ পর্যন্ত সময়টা হলো সাত সবক ইয়াদ ও শোনানোর সময়। ‘সাত সবক’ মানে শুধু ৭ পৃষ্ঠা নয়; তুমি যে পারায় পড়ছ, সেই পারায় ১৯ পৃষ্ঠা হলেও পুরোটা তোমার সাত সবক। আগামীকালের ফজরের জন্য না রেখে চেষ্টা করতে হবে আজ এশার পরেই তা শুনিয়ে ফেলার। ঘুমানোর আগে সবাই নামাজে দাঁড়িয়ে হাফ পারা তিলওয়াত করবে। এরপর কেউ চাইলে ওভারটাইম পড়তে পারে, সেটা তার ব্যক্তিগত বিষয়।",

                "**{{b}}হরফের মাশক ও দুপুরের ঘুম:{{/b}}** খাবার খেয়ে এসে ক্লাসে বসা এবং একটানা ১০টা পর্যন্ত হরফের মাশক (সঠিক উচ্চারণ অনুশীলন) করা। ১০টা থেকে ১২টা পর্যন্ত দুপুরের ঘুমের বিরতি।",
                "**{{b}}দুপুর ১২:০০ থেকে আসর (আমুখতা ও তিলওয়াত):{{/b}}** ১২টায় উঠে ওজু-গোসল সেরে ১২:৩০-এর মধ্যে ক্লাসে বসা এবং আমুখতা করো বাকি থাকলে তা শেষ করা। যোহরের নামাজ ও আমল শেষ করে দুপুরের খাবার খাওয়া। খাবার শেষে এমনি শুয়ে ১০ মিনিট বিশ্রাম করা। এরপর আবার ক্লাসে বসে আসর পর্যন্ত একটানা ৩, ৪ বা ৫ পারা (কমপক্ষে ৩ পারা) তিলওয়াত করা।",
                "**{{b}}সাপ্তাহিক ও মাসিক সবিনা (রিভিশন) নেযাম{{/b}}**",
                "**{{b}}বুধবারের নিয়ম:{{/b}}** বুধবারে সকালে সাত সবক শেষ করার পরেই এই সপ্তাহে যে কয় পারা আমুখতা শোনানো হয়েছে সেগুলো সহ সবিনার পারাগুলো বণ্টন করে দেওয়া। বুধবারে কোনো আমুখতা থাকবে না; সারা দিন শুধু সবিনার পারাগুলো ইয়াদ করা। বুধবার আছরের আগে নতুন সবক দেখবে, মাগরিবের পর নতুন সবক পড়া এবং বৃহস্পতিবার সকালে সবক দেওয়া।",

                "**{{b}}সবিনার হিসাব ও মাসিক সবিনা:{{/b}}** প্রতিদিন হাফ পারা আমুখতা দিলে সপ্তাহে হয় ২ পারা, আর বাইরে থেকে ১ পারা—মোট ৩ পারা করে প্রতি সপ্তাহে সবিনা হবে। চার সপ্তাহে পড়া হবে ১২ পারা। পঞ্চম সপ্তাহে একটানা এই ১২ পারা দাওর করা হবে, যাকে বলা হবে ‘মাসিক সবিনা’।",

const $ = (id) => document.getElementById(id);
const STORAGE_KEY = "boi_reader_progress_v1";

let state = {
  lastChapter: 0,
  fontSize: 18,
  dark: false
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function applyTheme(){
  document.body.classList.toggle('dark', state.dark);
  $('darkToggle').classList.toggle('on', state.dark);
}
function applyFontSize(){
  document.querySelectorAll('.chapter-body p').forEach(p => p.style.fontSize = state.fontSize + 'px');
}

/* ---------- SCREEN NAVIGATION ---------- */
let screenStack = ['screen-home'];
function showScreen(id, opts={}){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  $('topbar').style.display = id === 'screen-home' ? 'none' : 'flex';
  $('readerNav').style.display = id === 'screen-reader' ? 'flex' : 'none';
  const titles = { 'screen-toc':'সূচিপত্র', 'screen-search':'খুঁজুন', 'screen-reader': BOOK.title };
  $('topbarTitle').textContent = titles[id] || BOOK.title;
  if(!opts.replace){
    screenStack.push(id);
  }
  window.scrollTo(0,0);
  const scr = $(id);
  if(scr) scr.scrollTop = 0;
}
$('backBtn').addEventListener('click', () => {
  screenStack.pop();
  const prev = screenStack[screenStack.length-1] || 'screen-home';
  showScreen(prev, {replace:true});
});

/* ---------- HOME ---------- */
function renderHome(){
  $('bookTitle').textContent = BOOK.title;
  $('bookAuthor').textContent = BOOK.author;
  $('coverInitial').textContent = BOOK.title.trim().charAt(0) || "আ";
  if(state.lastChapter > 0 || (state.lastChapter === 0 && state.hasStarted)){
    $('coverProgress').textContent = `অধ্যায় ${state.lastChapter+1} পর্যন্ত পড়েছেন`;
    $('continueBtn').textContent = "পড়া চালিয়ে যান";
  }else{
    $('coverProgress').textContent = "এখনও পড়া শুরু হয়নি";
    $('continueBtn').textContent = "পড়া শুরু করুন";
  }
}
$('continueBtn').addEventListener('click', () => openChapter(state.lastChapter || 0));
$('tocBtnHome').addEventListener('click', () => showScreen('screen-toc'));
$('searchBtnHome').addEventListener('click', () => { showScreen('screen-search'); $('searchInput').focus(); });

/* ---------- TOC ---------- */
function renderTOC(){
  const list = $('tocList');
  list.innerHTML = '';
  BOOK.chapters.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'toc-item' + (i <= state.lastChapter && state.hasStarted ? ' read' : '');
    item.innerHTML = `
      <div class="toc-num">${i === 0 ? "শুরু" : i}</div>
      <div class="toc-text">
        <div class="toc-item-title">${ch.title}</div>
        <div class="toc-item-sub">${ch.paragraphs.length} অনুচ্ছেদ</div>
      </div>
      <div class="toc-chevron">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>`;
    item.addEventListener('click', () => openChapter(i));
    list.appendChild(item);
  });
}

/* ---------- READER ---------- */
let currentChapter = 0;
function openChapter(i, highlightTerm){
  currentChapter = Math.max(0, Math.min(BOOK.chapters.length-1, i));
  const ch = BOOK.chapters[currentChapter];
  $('chapterLabel').textContent = currentChapter === 0 ? 'শুরুর কথা' : `অধ্যায় ${currentChapter} / ${BOOK.chapters.length-1}`;
  $('chapterTitle').textContent = ch.title;
  const body = $('chapterBody');
  body.innerHTML = '';
  ch.paragraphs.forEach(p => {
    const el = document.createElement('p');
    let html = p
      .replace(/\{\{r\}\}([\s\S]+?)\{\{\/r\}\}/g, '<span class="clr-red">$1</span>')
      .replace(/\{\{g\}\}([\s\S]+?)\{\{\/g\}\}/g, '<span class="clr-green">$1</span>')
      .replace(/\{\{b\}\}([\s\S]+?)\{\{\/b\}\}/g, '<span class="clr-blue">$1</span>')
      .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
    if(highlightTerm){
      const re = new RegExp('(' + highlightTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
      if(re.test(p)){
        html = html.replace(re, '<mark>$1</mark>');
        el.classList.add('highlighted');
      }
    }
    el.innerHTML = html;
    body.appendChild(el);
  });
  applyFontSize();
  $('prevChapterBtn').disabled = currentChapter === 0;
  $('nextChapterBtn').disabled = currentChapter === BOOK.chapters.length - 1;
  state.lastChapter = currentChapter;
  state.hasStarted = true;
  saveState();
  showScreen('screen-reader');
  updateProgressBar();
}
$('prevChapterBtn').addEventListener('click', () => { if(currentChapter>0) openChapter(currentChapter-1); });
$('nextChapterBtn').addEventListener('click', () => { if(currentChapter<BOOK.chapters.length-1) openChapter(currentChapter+1); });

function updateProgressBar(){
  const pct = BOOK.chapters.length <= 1 ? 100 : (currentChapter/(BOOK.chapters.length-1))*100;
  $('progressFill').style.width = pct + '%';
}

/* ---------- SEARCH ---------- */
$('searchInput').addEventListener('input', (e) => {
  const term = e.target.value.trim();
  const area = $('searchArea');
  if(term.length < 2){
    area.innerHTML = '<div class="search-hint">অন্তত ২ অক্ষর টাইপ করুন খোঁজা শুরু করতে</div>';
    return;
  }
  const results = [];
  BOOK.chapters.forEach((ch, ci) => {
    ch.paragraphs.forEach((p, pi) => {
      const idx = p.toLowerCase().indexOf(term.toLowerCase());
      if(idx !== -1){
        const start = Math.max(0, idx-40);
        const end = Math.min(p.length, idx+term.length+60);
        let snippet = (start>0?'…':'') + p.slice(start,end) + (end<p.length?'…':'');
        const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
        snippet = snippet.replace(re, '<mark>$1</mark>');
        results.push({ci, title: ch.title, snippet});
      }
    });
  });
  if(results.length === 0){
    area.innerHTML = '<div class="search-hint">কোনো ফলাফল পাওয়া যায়নি</div>';
    return;
  }
  area.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'search-results';
  results.forEach(r => {
    const el = document.createElement('div');
    el.className = 'result-item';
    el.innerHTML = `<div class="result-chap">${r.title}</div><div class="result-snippet">${r.snippet}</div>`;
    el.addEventListener('click', () => openChapter(r.ci, term));
    wrap.appendChild(el);
  });
  area.appendChild(wrap);
});

/* ---------- SETTINGS SHEET ---------- */
function openSheet(){ $('sheetOverlay').classList.add('open'); $('settingsSheet').classList.add('open'); }
function closeSheet(){ $('sheetOverlay').classList.remove('open'); $('settingsSheet').classList.remove('open'); }
$('settingsBtn').addEventListener('click', openSheet);
$('sheetOverlay').addEventListener('click', closeSheet);
$('darkToggle').addEventListener('click', () => { state.dark = !state.dark; applyTheme(); saveState(); });
$('fsPlus').addEventListener('click', () => { state.fontSize = Math.min(28, state.fontSize+2); applyFontSize(); saveState(); });
$('fsMinus').addEventListener('click', () => { state.fontSize = Math.max(14, state.fontSize-2); applyFontSize(); saveState(); });

/* ---------- INIT ---------- */
loadState();
applyTheme();
renderHome();
renderTOC();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
