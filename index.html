<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>আয়না ঘরে হেফজখানা</title>
<meta name="theme-color" content="#8C5F22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="আয়না ঘরে হেফজখানা">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDFBF7;
    --paper-card:#F4ECE1;
    --paper-2:#EFE5D5;
    --ink:#2C2218;
    --ink-soft:#665A4C;
    --accent:#C68B38;
    --accent-deep:#8C5F22;
    --line:#E2D6C3;
    --dark-bg:#12100E;
    --dark-card:#1C1814;
    --dark-surface:#26211C;
    --dark-ink:#EAE2D5;
    --dark-ink-soft:#A09585;
    --dark-line:#383026;
    --shadow: 0 10px 30px -10px rgba(140, 95, 34, 0.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Hind Siliguri','Noto Serif Bengali',sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
    transition: background-color .3s, color .3s;
  }
  body.dark{background:var(--dark-bg); color:var(--dark-ink);}

  #app{position:relative; height:100vh; width:100vw; overflow:hidden;}

  /* TOP BAR */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:12px 16px calc(10px + env(safe-area-inset-top,0px));
    background:rgba(253, 251, 247, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom:1px solid var(--line);
    transition: background .3s, border-color .3s;
  }
  body.dark .topbar{
    background:rgba(28, 24, 20, 0.88);
    border-color:var(--dark-line);
  }
  .icon-btn{
    width:42px; height:42px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px; border:1px solid var(--line);
    background:var(--paper-card); color:var(--ink); cursor:pointer;
    transition: all .2s;
  }
  body.dark .icon-btn{border-color:var(--dark-line); background:var(--dark-surface); color:var(--dark-ink);}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn svg{width:22px; height:22px; display:block;}
  
  .topbar-title{
    font-family:'Noto Serif Bengali',serif; font-weight:700; font-size:17px;
    flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--accent-deep);
  }
  body.dark .topbar-title{color:var(--accent);}

  /* SCREENS */
  .screen{
    position:absolute; inset:0;
    padding-top:64px;
    padding-top:calc(64px + env(safe-area-inset-top,0px));
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1);
    background:var(--paper);
  }
  body.dark .screen{background:var(--dark-bg);}
  .screen.active{transform:translateX(0);}

  /* HOME / COVER */
  #screen-home{padding-top:0;}
  .cover-wrap{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:40px 24px; gap:22px;
  }
  .book-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:36px 24px;
    width:100%; max-width:340px;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:16px;
    position:relative; overflow:hidden;
  }
  body.dark .book-card{background:var(--dark-card); border-color:var(--dark-line);}
  
  .cover-mark{
    width:70px; height:70px; border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    display:flex; align-items:center; justify-content:center;
    color:#FFF; font-family:'Noto Serif Bengali',serif; font-size:32px; font-weight:700;
    box-shadow:0 10px 20px -5px rgba(140,95,34,0.4);
  }
  .cover-title{
    font-family:'Noto Serif Bengali',serif; font-weight:700; font-size:28px; line-height:1.3;
    color:var(--ink);
  }
  body.dark .cover-title{color:var(--dark-ink);}
  
  .cover-author{
    color:var(--accent-deep); font-size:15px; font-weight:600;
    background:rgba(198, 139, 56, 0.12); padding:6px 16px; border-radius:20px;
  }
  body.dark .cover-author{color:var(--accent); background:rgba(198, 139, 56, 0.2);}

  .cover-actions{display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px;}
  .btn-primary{
    padding:16px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    color:#FFF; font-weight:700; font-size:16px; font-family:inherit;
    box-shadow:0 8px 18px -4px rgba(140, 95, 34, 0.35);
    transition: transform .2s;
  }
  .btn-primary:active{transform:scale(.98);}
  
  .btn-secondary{
    padding:14px; border-radius:14px; cursor:pointer;
    background:var(--paper-card); border:1px solid var(--line); color:var(--ink);
    font-weight:600; font-size:15px; font-family:inherit;
    transition: all .2s;
  }
  body.dark .btn-secondary{background:var(--dark-card); border-color:var(--dark-line); color:var(--dark-ink);}
  .btn-secondary:active{transform:scale(.98);}
  
  .cover-progress{font-size:13px; color:var(--ink-soft); font-weight:500;}
  body.dark .cover-progress{color:var(--dark-ink-soft);}

  /* TOC */
  .toc-list{padding:12px 16px 40px;}
  .toc-item{
    display:flex; align-items:center; gap:16px;
    padding:16px 14px; margin-bottom:10px;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:16px; cursor:pointer; transition: all .2s;
  }
  body.dark .toc-item{background:var(--dark-card); border-color:var(--dark-line);}
  .toc-item:active{transform:scale(.98);}
  
  .toc-num{
    width:38px; height:38px; border-radius:12px; flex-shrink:0;
    background:rgba(198, 139, 56, 0.15); color:var(--accent-deep);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px;
  }
  body.dark .toc-num{color:var(--accent); background:rgba(198, 139, 56, 0.2);}
  .toc-text{flex:1; min-width:0;}
  .toc-item-title{font-size:16px; font-weight:600; font-family:'Noto Serif Bengali',serif;}
  .toc-item-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  body.dark .toc-item-sub{color:var(--dark-ink-soft);}

  /* SEARCH */
  .search-bar-wrap{padding:16px 16px 8px;}
  .search-input{
    width:100%; padding:14px 16px; border-radius:14px;
    border:1px solid var(--line); background:var(--paper-card); color:var(--ink);
    font-size:15px; font-family:inherit; transition: border-color .2s;
  }
  body.dark .search-input{background:var(--dark-card); border-color:var(--dark-line); color:var(--dark-ink);}
  .search-input:focus{outline:none; border-color:var(--accent);}
  .search-hint{padding:20px; color:var(--ink-soft); font-size:14px; text-align:center;}
  body.dark .search-hint{color:var(--dark-ink-soft);}
  .search-results{padding:8px 16px 40px;}
  .result-item{
    padding:14px; margin-bottom:10px; background:var(--paper-card);
    border:1px solid var(--line); border-radius:14px; cursor:pointer;
  }
  body.dark .result-item{background:var(--dark-card); border-color:var(--dark-line);}
  .result-chap{font-size:12px; color:var(--accent-deep); font-weight:700; margin-bottom:6px;}
  body.dark .result-chap{color:var(--accent);}
  .result-snippet{font-size:14.5px; line-height:1.6;}
  mark{background:var(--accent); color:#FFF; border-radius:4px; padding:0 4px;}

  /* READER (IMPORTANT: Padding for bottom floating buttons) */
  #screen-reader .screen-inner{
    padding:20px 20px 140px 20px; /* ১৭০ পিক্সেল বটম প্যাডিং যাতে লেখা বাটন দিয়ে
